<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISAC GAMES · Estado del contenido</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --green: #00593f; --green-soft: #e6f2ee; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Sora', system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  a.back { display: inline-block; font-size: .8rem; font-weight: 700; color: var(--green); text-decoration: none; background: var(--green-soft); padding: .3rem .7rem; border-radius: 999px; }
  h1 { color: var(--green); font-size: 1.7rem; margin: 14px 0 4px; }
  p { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; font-size: .9rem; }
  th { text-align: left; background: #f1f5f9; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; padding: .6rem .75rem; }
  td { padding: .65rem .75rem; border-top: 1px solid var(--border); }
  .pill { display: inline-block; min-width: 3.2rem; text-align: center; font-weight: 800; border-radius: 999px; padding: .15rem .55rem; }
  .ok { background: #dcfce7; color: #166534; } .warn { background: #fef3c7; color: #92400e; } .bad { background: #fee2e2; color: #991b1b; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 12px; }
  @media (max-width: 560px) { .hide-sm { display: none; } td, th { padding: .55rem .5rem; } }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Hub ISAC Games</a>
  <h1>Estado del contenido</h1>
  <p id="meta">Cargando…</p>
  <table>
    <thead><tr><th>Juego</th><th>Días restantes</th><th class="hide-sm">Hasta</th><th>Hoy</th><th class="hide-sm">Se rellena solo</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="note">🟢 14 días o más · 🟡 7 a 13 · 🔴 menos de 7. Los juegos que se rellenan solos reponen días en cada corrida diaria del workflow; si alguno baja de 7, revisa la última corrida en GitHub Actions.</p>
</main>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  fetch('estado/status.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(s => {
      const when = new Date(s.generated).toLocaleString('es-MX', { timeZone: 'America/Mexico_City', dateStyle: 'medium', timeStyle: 'short' });
      document.getElementById('meta').textContent = `Actualizado: ${when} (hora CDMX). Hoy: ${s.today}.`;
      document.getElementById('rows').innerHTML = s.games.map(g => {
        const d = g.days;
        const cls = d == null ? 'bad' : d >= 14 ? 'ok' : d >= 7 ? 'warn' : 'bad';
        return `<tr><td><strong>${esc(g.name)}</strong></td><td><span class="pill ${cls}">${d == null ? '—' : d}</span></td>` +
          `<td class="hide-sm">${esc(g.last || '—')}</td><td>${g.today_ok ? '✅' : '❌'}</td><td class="hide-sm">${g.auto ? 'Sí' : 'No'}</td></tr>`;
      }).join('');
    })
    .catch(() => { document.getElementById('meta').textContent = 'Todavía no hay datos: aparecen después de la siguiente corrida del workflow de juegos.'; });
</script>
</body>
</html>
