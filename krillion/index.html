   puntaje por rareza T1-T5 = 20-100 + bono de tiempo) es el mismo en todos los deportes; cada skin decide:
   cómo avanza la jugada, el bono grande del deporte (xb), los nombres y el dibujo.
   - nfl / fut / multi: cancha vertical que se recorre de la yarda/metro 10 a la 100 (la cámara sigue al balón).
   - nba: media cancha, cada respuesta es un tiro desde una zona distinta (sin scroll).
   - mlb: diamante; sencillo, doble, triple o jonrón y las carreras son el bono (3 outs = fin).
   - f1: parrilla de 20 autos; remontas posiciones; podio y victoria dan bono.
   - legacy: partidas guardadas antes de las skins (reglas viejas: NFL desde la 25, TD = +70 aparte). */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const TXT = (x, y, t, o = {}) => `<text x="${x}" y="${y}" fill="${o.fill || '#fff'}" font-family="${o.font || 'Sora, sans-serif'}" font-size="${o.size || 16}" font-weight="${o.w || 800}" text-anchor="${o.anchor || 'middle'}"${o.op ? ` fill-opacity="${o.op}"` : ''}${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke"` : ''}${o.extra || ''}>${t}<\/text>`;
  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- animación: balón a lo largo de un path (y cámara que lo sigue en las canchas largas) ----------
  let anim = 0;
  function animateBall(svg, pathId, ballId, opts = {}) {
    const path = svg.querySelector('#' + pathId), ball = svg.querySelector('#' + ballId);
    if (!path || !ball || !path.getTotalLength) { if (opts.done) opts.done(); return; }
    const len = path.getTotalLength(), dur = opts.dur || 1200, t0 = performance.now();
    if (anim) cancelAnimationFrame(anim);
    const place = k => {
      const p = path.getPointAtLength(len * k);
      ball.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})${opts.lift ? ` scale(${(1 + opts.lift * Math.sin(Math.PI * k)).toFixed(3)})` : ''}`);
      if (opts.follow) opts.follow(p);
    };
    if (reduceMotion()) { place(1); if (opts.done) opts.done(); return; }
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      place(e);
      anim = k < 1 ? requestAnimationFrame(step) : 0;
      if (k >= 1 && opts.done) opts.done();
    };
    place(0);
    anim = requestAnimationFrame(step);
  }

  // =====================================================================================================
  // CANCHAS VERTICALES (NFL, fútbol, multideporte): de tu 10 hacia la 100; cada jugada va a otra zona.
  // =====================================================================================================
  const FW = 600, YU = 12, EZ = 120, FH = EZ * 2 + 100 * YU, VH = 760;
  const Y = d => EZ + d * YU;
  const GOAL_Y = Y(100) + 60;
  // a dónde va el balón según la jugada (izquierda/derecha alterna con la jugada)
  const LANE = { 1: [0, 0], 2: [-150, 150], 3: [-85, 85], 4: [-190, 190], 5: [-215, 215] };
  const clampX = x => Math.max(70, Math.min(FW - 70, x));
  const snapX = x => Math.max(240, Math.min(360, x));          // siguiente jugada: entre los hash marks

  function fieldSkin(cfg) {
    const sk = {
      kind: 'field', scroll: true, aspect: '600 / 760', strikeLabel: 'STRIKES', start: cfg.start, ...cfg,
      init: () => ({ yard: cfg.start, tds: 0, bx: 300 }),
      ballLabel: st => cfg.ballLabel(st.yard),
      hudLabel: cfg.hudLabel,
      gain(st, tier, round) {
        const from = st.yard, x1 = st.bx ?? 300, side = round % 2 ? 1 : 0;
        const x2 = clampX(x1 + LANE[tier][side] + (tier === 1 ? (round % 2 ? 18 : -18) : 0));
        let to = from + cfg.yd[tier], td = false;
        if (to >= 100) { td = true; st.tds++; }
        st.yard = td ? cfg.start : to;
        st.bx = td ? 300 : snapX(x2);
        return { yards: cfg.yd[tier], from, to: Math.min(to, 100), td, x1, x2, xb: td ? cfg.bonus : 0 };
      },
      inc(st, round) {
        const x1 = st.bx ?? 300;
        return { yards: 0, from: st.yard, to: st.yard, td: false, x1, x2: clampX(x1 + (round % 2 ? 120 : -120)), xb: 0 };
      },
      sack(st) {
        const from = st.yard, x1 = st.bx ?? 300;
        st.yard = Math.max(1, st.yard - cfg.sackYd);
        return { yards: -(from - st.yard), from, to: st.yard, td: false, x1, x2: x1, xb: 0 };
      },
      eventText: p => (p.td ? cfg.goalName : ''),
      tip(p) {
        const n = p.round + 1, u = cfg.unit;
        if (p.result === 'sack') return `Jugada ${n}: ${cfg.fail.sack.name} (−${Math.abs(p.yards)} ${u})`;
        if (p.result === 'inc') return `Jugada ${n}: ${cfg.fail.inc.name} (0 ${u})`;
        return `Jugada ${n}: ${cfg.types[p.tier].name} (+${p.yards} ${u}${p.td ? ', ' + cfg.goalName : ''}) con ${p.answer} · tier ${p.tier} · ${p.pts + p.bonus + (p.xb || 0)} pts`;
      },
      info(st, done, plays) {
        if (done) return `<span>Toca una jugada para ver el detalle.<\/span><span><strong>${st.tds}<\/strong> ${cfg.goalShort} · <strong>${plays.filter(p => p.result === 'gain').reduce((s, p) => s + p.yards, 0)}<\/strong> ${cfg.unit} ganadas<\/span>`;
        return `<span>${cfg.ballNoun} en tu ${cfg.unitOne} <strong>${st.yard}<\/strong> · faltan <strong>${100 - st.yard}<\/strong> ${cfg.unit} para ${cfg.goalWord}<\/span><span>Jugada <strong>${Math.min(plays.length + 1, 5)}<\/strong> de 5<\/span>`;
      },
      summaryTitle: (st, won) => (won ? (st.tds ? `${cfg.winTitle} con ${st.tds} ${st.tds === 1 ? cfg.goalShort1 : cfg.goalShortN}!` : `${cfg.winTitle}!`) : cfg.lossTitle),
      depth(st, done, plays, phase) {
        const last = plays[plays.length - 1];
        if (done) return Math.max(...plays.map(p => (p.td ? 100 : p.to)), cfg.start);
        return phase === 'result' && last ? (last.td ? 100 : last.to) : st.yard;
      }
    };
    sk.render = (svg, st, ctx) => renderField(sk, svg, st, ctx);
    return sk;
  }

  let cam = null, camRaf = 0;
  function setView(svg, c) { svg.setAttribute('viewBox', `0 ${c.y.toFixed(1)} ${FW} ${c.h.toFixed(1)}`); }
  function camFor(yPix) { return { y: Math.max(0, Math.min(FH - VH, yPix - 230)), h: VH }; }
  function camTo(svg, to, dur = 900) {
    if (camRaf) cancelAnimationFrame(camRaf);
    if (!cam || reduceMotion()) { cam = to; setView(svg, cam); return; }
    const from = { ...cam }, t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      cam = { y: from.y + (to.y - from.y) * e, h: from.h + (to.h - from.h) * e };
      setView(svg, cam);
      camRaf = k < 1 ? requestAnimationFrame(step) : 0;
    };
    camRaf = requestAnimationFrame(step);
  }

  function fieldPath(p) {
    const y1 = Y(p.from), x1 = p.x1 ?? 300, x2 = p.x2 ?? x1;
    if (p.result === 'sack') return `M ${x1} ${y1} L ${x1} ${Y(p.to)}`;
    if (p.result === 'inc') { const y2 = Math.min(Y(100) - 10, y1 + 150); return `M ${x1} ${y1} Q ${(x1 + x2) / 2} ${y1 + 40} ${x2} ${y2}`; }
    const y2 = p.td ? GOAL_Y : Y(p.to);
    if (p.tier === 1) return `M ${x1} ${y1} C ${x1 + 25} ${y1 + (y2 - y1) * 0.3} ${x2 - 25} ${y1 + (y2 - y1) * 0.6} ${x2} ${y2}`;
    const arc = Math.min(160, 30 + (y2 - y1) * 0.25);
    return `M ${x1} ${y1} Q ${(x1 + x2) / 2 + (x2 >= x1 ? -arc : arc) * 0.3} ${(y1 + y2) / 2 - arc * 0.2} ${x2} ${y2}`;
  }

  function renderField(sk, svg, st, ctx) {
    const { plays, done, lastDrawn, onPlay } = ctx;
    let s = sk.background();
    plays.forEach((p, i) => {
      const d = fieldPath(p), col = p.result === 'gain' ? sk.types[p.tier].color : p.result === 'inc' ? '#fecaca' : '#ef4444';
      const y2 = p.result === 'inc' ? Math.min(Y(100) - 10, Y(p.from) + 150) : p.td ? GOAL_Y : Y(p.to);
      s += `<g data-play="${i}" style="cursor:pointer">`;
      s += `<path id="kp${i}" d="${d}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"${p.result === 'inc' ? ' stroke-dasharray="10 10"' : ''} opacity="${i === plays.length - 1 && !done ? 1 : 0.85}"><title>${ctx.esc(sk.tip(p))}<\/title><\/path>`;
      s += `<path d="${d}" fill="none" stroke="transparent" stroke-width="26"/>`;
      s += `<circle cx="${p.x1 ?? 300}" cy="${Y(p.from)}" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>`;
      if (p.result === 'inc') s += TXT(p.x2, y2 + 10, '✕', { fill: '#fecaca', size: 30, stroke: '#0f172a' });
      if (p.td) s += TXT(p.x2, Y(100) + 46, sk.goalShortUpper, { fill: '#fde047', size: 40, font: 'Darker Grotesque, sans-serif', stroke: '#0f172a', sw: 6 });
      s += TXT(p.x1 ?? 300, Y(p.from) - 14, i + 1, { size: 16, stroke: '#0f172a', sw: 3 });
      s += `<\/g>`;
    });
    if (!done) {
      const yl = Y(st.yard), bx = st.bx ?? 300;
      s += `<line x1="0" y1="${yl}" x2="${FW}" y2="${yl}" stroke="#60a5fa" stroke-width="4"/>`;
      [1, 2, 3, 4, 5].forEach(t => {
        const to = st.yard + sk.yd[t], yg = to >= 100 ? GOAL_Y : Y(to);
        s += `<g opacity="0.85"><line x1="${bx - 14}" y1="${yg}" x2="${bx + 26}" y2="${yg}" stroke="${sk.types[t].color}" stroke-width="2" stroke-dasharray="4 4"/><circle cx="${bx + 40}" cy="${yg}" r="12" fill="${sk.types[t].color}"/>${TXT(bx + 40, yg + 4, 'T' + t, { fill: '#0f172a', size: 11 })}<\/g>`;
      });
    }
    // el balón (se anima en la última jugada nueva)
    const last = plays[plays.length - 1];
    const isNew = last && plays.length - 1 > lastDrawn;
    const bx0 = done || !last ? (st.bx ?? 300) : (last.x2 ?? 300), by0 = done || !last ? Y(st.yard) : (last.td ? GOAL_Y : Y(last.to));
    if (!done || isNew) s += `<g id="kball" transform="translate(${isNew ? (last.x1 ?? 300) : (st.bx ?? 300)} ${isNew ? Y(last.from) : Y(st.yard)})">${sk.ball()}<\/g>`;
    svg.innerHTML = s;
    svg.querySelectorAll('g[data-play]').forEach(g => {
      const i = +g.dataset.play;
      g.addEventListener('click', () => onPlay(i));
      g.addEventListener('mouseenter', () => onPlay(i));
    });
    if (isNew) {
      const target = done ? null : camFor(Y(st.yard));
      animateBall(svg, `kp${plays.length - 1}`, 'kball', {
        dur: 700 + Math.min(1300, Math.abs((last.td ? GOAL_Y : Y(last.to)) - Y(last.from)) * 2.2),
        lift: last.result === 'gain' && last.tier > 1 ? 0.6 : 0,
        follow: p => { if (camRaf) cancelAnimationFrame(camRaf); cam = camFor(p.y); setView(svg, cam); },
        done: () => {
          if (last.td) { const ez = svg.querySelector('#endzone'); if (ez) ez.classList.add('td-flash'); }
          if (done) camTo(svg, overview(sk, plays), 1200);
        }
      });
    } else if (done && plays.length) camTo(svg, overview(sk, plays));
    else camTo(svg, camFor(Y(st.yard)));
  }
  function overview(sk, plays) {
    const yds = plays.flatMap(p => [p.from, p.to]);
    const top = Math.max(0, Y(Math.min(sk.start, ...yds)) - 90);
    const bot = Math.min(FH, plays.some(p => p.td) ? FH : Y(Math.max(...yds)) + 160);
    const h = Math.max(VH, bot - top);
    return { y: Math.max(0, Math.min(top, FH - h)), h };
  }

  // --- fondos ---
  function bgNFL() {
    let s = `<rect x="0" y="0" width="${FW}" height="${FH}" fill="#2f7d32"/>`;
    for (let i = 0; i < 20; i++) s += `<rect x="0" y="${Y(i * 5)}" width="${FW}" height="${5 * YU}" fill="${i % 2 ? '#2b7430' : '#33873a'}"/>`;
    s += `<rect x="0" y="0" width="${FW}" height="${EZ}" fill="#00593f"/>`;
    s += `<rect id="endzone" x="0" y="${Y(100)}" width="${FW}" height="${EZ}" fill="#1e3a8a"/>`;
    for (let k = 0; k < 8; k++) s += `<line x1="${k * 80}" y1="${Y(100)}" x2="${k * 80 + 120}" y2="${FH}" stroke="#ffffff" stroke-opacity="0.07" stroke-width="18"/>`;
    s += TXT(FW / 2, EZ / 2 + 18, 'ISAC', { fill: '#ffffff', size: 54, font: 'Darker Grotesque, sans-serif', op: 0.9 });
    s += TXT(FW / 2, Y(100) + EZ / 2 + 18, 'KRILLION', { fill: '#ffffff', size: 54, font: 'Darker Grotesque, sans-serif', op: 0.85 });
    for (let yd = 0; yd <= 100; yd += 5) {
      const y = Y(yd);
      s += `<line x1="18" y1="${y}" x2="${FW - 18}" y2="${y}" stroke="#ffffff" stroke-opacity="${yd % 10 === 0 ? 0.85 : 0.45}" stroke-width="${yd === 0 || yd === 100 ? 6 : yd % 10 === 0 ? 3 : 2}"/>`;
      if (yd % 10 === 0 && yd > 0 && yd < 100) {
        const n = yd <= 50 ? yd : 100 - yd;
        s += TXT(64, y + 9, n, { size: 26, op: 0.85, extra: ` transform="rotate(90 64 ${y})"` });
        s += TXT(FW - 64, y + 9, n, { size: 26, op: 0.85, extra: ` transform="rotate(-90 ${FW - 64} ${y})"` });
      }
    }
    for (let yd = 1; yd < 100; yd++) {
      const y = Y(yd);
      s += `<line x1="22" y1="${y}" x2="32" y2="${y}" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/><line x1="${FW - 32}" y1="${y}" x2="${FW - 22}" y2="${y}" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>`;
      s += `<line x1="246" y1="${y}" x2="256" y2="${y}" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><line x1="344" y1="${y}" x2="354" y2="${y}" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/>`;
    }
    s += `<rect x="12" y="0" width="${FW - 24}" height="${FH}" fill="none" stroke="#ffffff" stroke-width="6"/>`;
    // postes
    [[EZ * 0.1, -1], [FH - EZ * 0.1, 1]].forEach(([y]) => { s += `<line x1="270" y1="${y}" x2="330" y2="${y}" stroke="#fde047" stroke-width="6"/><circle cx="300" cy="${y}" r="5" fill="#fde047"/>`; });
    return s;
  }
  function bgFut() {
    let s = `<rect x="0" y="0" width="${FW}" height="${FH}" fill="#2e8b4f"/>`;
    for (let i = 0; i < 12; i++) s += `<rect x="0" y="${i * FH / 12}" width="${FW}" height="${FH / 24}" fill="#287c46"/>`;
    const L = 'stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" fill="none"';
    s += `<rect x="20" y="${Y(0)}" width="${FW - 40}" height="${100 * YU}" ${L}/>`;
    s += `<line x1="20" y1="${Y(50)}" x2="${FW - 20}" y2="${Y(50)}" ${L}/><circle cx="300" cy="${Y(50)}" r="90" ${L}/><circle cx="300" cy="${Y(50)}" r="5" fill="#fff"/>`;
    [[Y(0), 1], [Y(100), -1]].forEach(([y, d]) => {
      s += `<rect x="130" y="${d > 0 ? y : y - 200}" width="340" height="200" ${L}/>`;
      s += `<rect x="215" y="${d > 0 ? y : y - 70}" width="170" height="70" ${L}/>`;
      s += `<circle cx="300" cy="${y + d * 135}" r="5" fill="#fff"/>`;
      s += `<path d="M 230 ${y + d * 200} A 90 90 0 0 ${d > 0 ? 0 : 1} 370 ${y + d * 200}" ${L}/>`;
    });
    s += `<rect x="0" y="0" width="${FW}" height="${EZ}" fill="#00593f"/>` + TXT(300, EZ / 2 + 16, 'ISAC', { size: 50, font: 'Darker Grotesque, sans-serif' });
    s += `<rect id="endzone" x="0" y="${Y(100)}" width="${FW}" height="${EZ}" fill="#14532d"/>`;
    s += `<rect x="240" y="${Y(100)}" width="120" height="34" fill="none" stroke="#ffffff" stroke-width="5"/>`;
    for (let k = 0; k < 6; k++) s += `<line x1="${240 + k * 24}" y1="${Y(100)}" x2="${240 + k * 24}" y2="${Y(100) + 34}" stroke="#fff" stroke-opacity="0.5"/>`;
    s += TXT(300, Y(100) + 90, 'PORTERÍA RIVAL', { size: 26, op: 0.75 });
    for (let m = 10; m < 100; m += 10) s += TXT(50, Y(m) + 6, m + ' m', { size: 15, op: 0.55 });
    return s;
  }
  function bgMulti() {
    let s = `<rect x="0" y="0" width="${FW}" height="${FH}" fill="#b4532a"/>`;
    for (let k = 0; k <= 6; k++) s += `<line x1="${60 + k * 80}" y1="${Y(0)}" x2="${60 + k * 80}" y2="${Y(100)}" stroke="#fff" stroke-opacity="0.8" stroke-width="3"/>`;
    for (let m = 10; m < 100; m += 10) { s += `<line x1="60" y1="${Y(m)}" x2="540" y2="${Y(m)}" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/>` + TXT(30, Y(m) + 6, m, { size: 15, op: 0.7 }); }
    s += `<rect x="0" y="0" width="${FW}" height="${EZ}" fill="#00593f"/>` + TXT(300, EZ / 2 + 16, 'ESTADIO ISAC', { size: 44, font: 'Darker Grotesque, sans-serif' });
    s += `<rect id="endzone" x="0" y="${Y(100)}" width="${FW}" height="${EZ}" fill="#0f172a"/>`;
    for (let i = 0; i < 24; i++) s += `<rect x="${i * 25}" y="${Y(100) + (i % 2 ? 0 : 14)}" width="25" height="14" fill="#fff"/>`;
    s += TXT(300, Y(100) + 80, 'META', { size: 40, font: 'Darker Grotesque, sans-serif' });
    return s;
  }
  const ballNFL = () => `<ellipse rx="10" ry="15" fill="#8b4513" stroke="#fff" stroke-width="2"/><line x1="0" y1="-6" x2="0" y2="6" stroke="#fff" stroke-width="2"/>`;
  const ballFut = () => `<circle r="12" fill="#fff" stroke="#0f172a" stroke-width="2"/><path d="M0 -5 L5 -1 L3 5 L-3 5 L-5 -1 Z" fill="#0f172a"/>`;
  const ballMulti = () => `<circle r="12" fill="#00593f" stroke="#fff" stroke-width="3"/>${TXT(0, 5, 'I', { size: 14 })}`;

  const COLORS = { 1: '#fde047', 2: '#86efac', 3: '#7dd3fc', 4: '#fb923c', 5: '#e879f9' };
  const T = (names, emojis) => Object.fromEntries([1, 2, 3, 4, 5].map(t => [t, { name: names[t - 1], short: names[t - 1], emoji: emojis[t - 1], color: COLORS[t] }]));

  const yardaNFL = y => (y < 50 ? `P${y}` : y === 50 ? '50' : `R${100 - y}`);   // yarda propia 1-49 = P, rival = R
  const SKINS = {};
  SKINS.nfl = fieldSkin({
    id: 'nfl', nombre: 'NFL', sticker: 'americano1', start: 10, yd: { 1: 2, 2: 6, 3: 15, 4: 25, 5: 50 }, sackYd: 5, bonus: 70,
    unit: 'yd', unitOne: 'yarda', ballNoun: 'Balón', goalWord: 'touchdown', goalName: 'TOUCHDOWN', goalShort: 'TD', goalShort1: 'touchdown', goalShortN: 'touchdowns', goalShortUpper: 'TD',
    hudLabel: 'BALÓN EN', ballLabel: yardaNFL,
    winTitle: '¡Drive completado', lossTitle: 'Turnover on downs',
    subtitle: 'Responde lo más nicho posible: entre más rara tu respuesta, más lejos llega el pase.',
    types: T(['Carrera por el centro', 'Pase corto a la banda', 'Pase intermedio', 'Jugada explosiva', 'Bomba'], ['🏃', '🎯', '🏈', '💥', '🚀']),
    fail: { inc: { name: 'Pase incompleto', emoji: '✕', text: 'Se acabaron los intentos: 0 yardas.' }, sack: { name: 'Sack', emoji: '🛑', text: 'Se acabó el reloj: 5 yardas de pérdida.' } },
    intro: s => `Arrancas en tu yarda ${s.start} y bajas hacia la end zone rival. Cada respuesta es un pase a otra zona del campo: la carrera va por el centro, el pase corto a la banda y la <strong>bomba<\/strong> cruza media cancha. Touchdown = <strong>+${s.bonus}<\/strong> y el balón vuelve a tu ${s.start}.`,
    background: bgNFL, ball: ballNFL
  });
  SKINS.fut = fieldSkin({
    id: 'fut', nombre: 'Fútbol', strikeLabel: 'PÉRDIDAS', sticker: 'fut1', start: 10, yd: { 1: 3, 2: 8, 3: 15, 4: 25, 5: 50 }, sackYd: 5, bonus: 70,
    unit: 'm', unitOne: 'metro', ballNoun: 'Balón', goalWord: 'el gol', goalName: '¡GOL!', goalShort: 'goles', goalShort1: 'gol', goalShortN: 'goles', goalShortUpper: 'GOL',
    hudLabel: 'BALÓN EN', ballLabel: y => `${y} m`,
    winTitle: '¡Jugada completada', lossTitle: 'Perdiste la posesión',
    subtitle: 'Responde lo más nicho posible: entre más rara tu respuesta, más cerca de la portería llegas.',
    types: T(['Toque corto', 'Pase filtrado', 'Conducción', 'Contragolpe', 'Pase largo de 50 m'], ['👟', '🎯', '⚽', '💨', '🚀']),
    fail: { inc: { name: 'Pase interceptado', emoji: '✕', text: 'Se acabaron los intentos: no avanzas.' }, sack: { name: 'Fuera de lugar', emoji: '🚩', text: 'Se acabó el reloj: retrocedes 5 metros.' } },
    intro: s => `Sales desde tu área (metro ${s.start}) y la portería rival está a 100 m. Cada respuesta es un pase o conducción hacia otra zona de la cancha; entre más nicho, más profundo. Gol = <strong>+${s.bonus}<\/strong> y vuelves a salir desde tu área.`,
    background: bgFut, ball: ballFut
  });
  SKINS.multi = fieldSkin({
    id: 'multi', nombre: 'Multideporte', strikeLabel: 'FALLAS', sticker: 'isacbot', start: 10, yd: { 1: 3, 2: 8, 3: 15, 4: 25, 5: 50 }, sackYd: 5, bonus: 70,
    unit: 'm', unitOne: 'metro', ballNoun: 'Vas', goalWord: 'la meta', goalName: '¡META!', goalShort: 'metas', goalShort1: 'meta', goalShortN: 'metas', goalShortUpper: 'META',
    hudLabel: 'VAS EN', ballLabel: y => `${y} m`,
    winTitle: '¡Carrera completada', lossTitle: 'Te descalificaron',
    subtitle: 'Responde lo más nicho posible: entre más rara tu respuesta, más rápido llegas a la meta.',
    types: T(['Paso firme', 'Zancada', 'Sprint', 'Salto largo', 'Vuelo ISAC'], ['🚶', '🏃', '⚡', '🦘', '🚀']),
    fail: { inc: { name: 'Tropiezo', emoji: '✕', text: 'Se acabaron los intentos: no avanzas.' }, sack: { name: 'Salida en falso', emoji: '🛑', text: 'Se acabó el reloj: retrocedes 5 metros.' } },
    intro: s => `Corres en la pista del Estadio ISAC desde el metro ${s.start}; la meta está a 100. Entre más nicho tu respuesta, más avanzas. Cruzar la meta = <strong>+${s.bonus}<\/strong> y vuelves a salir.`,
    background: bgMulti, ball: ballMulti
  });
  // partidas guardadas antes de las skins: NFL desde la 25 y el bono del TD se suma aparte (st.tds × 70)
  SKINS.legacy = fieldSkin({ ...SKINS.nfl, ballLabel: yardaNFL, id: 'legacy', start: 25, bonus: 0,
    intro: s => `Arrancas en tu yarda ${s.start}. Touchdown = +70.` });
  SKINS.legacy.legacyTdBonus = 70;

  // =====================================================================================================
  // NBA: media cancha; cada respuesta es un tiro desde una zona (sin scroll).
  // =====================================================================================================
  const HOOP = { x: 300, y: 86 };
  const SPOTS = {
    1: [[290, 132], [312, 128]],                       // bandeja
    2: [[250, 196], [352, 190]],                       // pintura
    3: [[150, 250], [455, 262]],                       // media distancia
    4: [[52, 104], [548, 104]],                        // triple de esquina
    5: [[300, 540], [300, 540]]                        // desde el logo
  };
  const NBA_PTS = { 1: 2, 2: 2, 3: 2, 4: 3, 5: 3 };
  SKINS.nba = {
    id: 'nba', kind: 'court', scroll: false, aspect: '1 / 1', strikeLabel: 'FALLAS', nombre: 'NBA', sticker: 'basket', hudLabel: 'MARCADOR',
    subtitle: 'Responde lo más nicho posible: entre más rara tu respuesta, más lejano y espectacular el tiro.',
    types: T(['Bandeja', 'Tiro en la pintura', 'Media distancia', 'Triple de esquina', 'Triple desde el logo'], ['🏀', '✋', '🎯', '🔥', '🚀']),
    fail: { inc: { name: 'Tiro fallado', emoji: '✕', text: 'Se acabaron los intentos: el balón sale del aro.' }, sack: { name: 'Violación de 24 segundos', emoji: '⏱️', text: 'Se acabó el reloj: pierdes la posesión.' } },
    init: () => ({ nbaPts: 0, streak: 0 }),
    ballLabel: st => `${st.nbaPts || 0} pts`,
    intro: () => `Cinco posesiones. Cada respuesta es un tiro: <strong>bandeja<\/strong> si es muy conocida y <strong>triple desde el logo<\/strong> si es la más nicho. Desde la 3ª canasta seguida estás <strong>en llamas<\/strong>: +25 de bono por canasta.`,
    gain(st, tier, round) {
      const [x, y] = SPOTS[tier][round % 2];
      st.nbaPts = (st.nbaPts || 0) + NBA_PTS[tier];
      st.streak = (st.streak || 0) + 1;
      const fire = st.streak >= 3;
      return { yards: NBA_PTS[tier], from: 0, to: 0, td: fire, x1: x, y1: y, xb: fire ? 25 : 0 };
    },
    inc(st, round) { st.streak = 0; const [x, y] = SPOTS[3][round % 2]; return { yards: 0, x1: x, y1: y, td: false, xb: 0 }; },
    sack(st, round) { st.streak = 0; const [x, y] = SPOTS[2][round % 2]; return { yards: 0, x1: x, y1: y, td: false, xb: 0 }; },
    tip(p) {
      const n = p.round + 1;
      if (p.result !== 'gain') return `Posesión ${n}: ${this.fail[p.result].name}`;
      return `Posesión ${n}: ${this.types[p.tier].name} (+${p.yards})${p.td ? ' · ¡en llamas!' : ''} con ${p.answer} · tier ${p.tier} · ${p.pts + p.bonus + (p.xb || 0)} pts`;
    },
    eventText: p => (p.td ? '¡EN LLAMAS!' : ''),
    info(st, done, plays) {
      const made = plays.filter(p => p.result === 'gain').length;
      return `<span>Marcador: <strong>${st.nbaPts || 0}<\/strong> pts · ${made} de ${plays.length} tiros<\/span><span>${done ? 'Toca un tiro para ver el detalle.' : `Posesión <strong>${Math.min(plays.length + 1, 5)}<\/strong> de 5`}<\/span>`;
    },
    summaryTitle: (st, won) => (won ? `¡Partido terminado: ${st.nbaPts} puntos!` : 'Te quedaste frío'),
    render(svg, st, ctx) {
      const { plays, done, lastDrawn, onPlay } = ctx;
      svg.setAttribute('viewBox', '0 0 600 600');
      const L = 'stroke="#ffffff" stroke-width="4" fill="none"';
      let s = `<rect width="600" height="600" fill="#d79b5b"/>`;
      for (let i = 0; i < 15; i++) s += `<rect x="0" y="${i * 40}" width="600" height="20" fill="#cf9252" opacity="0.6"/>`;
      s += `<rect x="190" y="30" width="220" height="250" fill="#00593f" opacity="0.85"/><rect x="190" y="30" width="220" height="250" ${L}/>`;
      s += `<circle cx="300" cy="280" r="70" ${L}/><path d="M 36 30 L 36 140 A 268 268 0 0 0 564 140 L 564 30" ${L}/>`;
      s += `<path d="M 255 86 A 45 45 0 0 0 345 86" ${L}/><rect x="10" y="10" width="580" height="580" ${L}/>`;
      s += `<path d="M 200 590 A 100 100 0 0 1 400 590" ${L}/>` + TXT(300, 572, 'ISAC', { size: 34, font: 'Darker Grotesque, sans-serif', op: 0.8 });
      s += `<line x1="260" y1="56" x2="340" y2="56" stroke="#ffffff" stroke-width="6"/><circle id="hoop" cx="${HOOP.x}" cy="${HOOP.y}" r="16" fill="none" stroke="#ea580c" stroke-width="5"/>`;
      if (!done) [1, 2, 3, 4, 5].forEach(t => {
        const [x, y] = SPOTS[t][plays.length % 2];
        s += `<g opacity="0.8"><circle cx="${x}" cy="${y}" r="15" fill="${COLORS[t]}" stroke="#0f172a" stroke-opacity="0.4"/>${TXT(x, y + 4, 'T' + t, { fill: '#0f172a', size: 11 })}<\/g>`;
      });
      plays.forEach((p, i) => {
        const x = p.x1 ?? 300, y = p.y1 ?? 250, ok = p.result === 'gain';
        const endX = ok ? HOOP.x : HOOP.x + (i % 2 ? 26 : -26), endY = ok ? HOOP.y : HOOP.y + 20;
        const bend = Math.abs(x - endX) < 40 ? (i % 2 ? 140 : -140) : 0;
        const d = `M ${x} ${y} Q ${(x + endX) / 2 + bend} ${Math.min(y, endY) - 90 - Math.abs(y - endY) * 0.25} ${endX} ${endY}`;
        s += `<g data-play="${i}" style="cursor:pointer"><path id="kp${i}" d="${d}" fill="none" stroke="${ok ? COLORS[p.tier] : '#fecaca'}" stroke-width="4" stroke-dasharray="${ok ? '' : '8 8'}" opacity="0.9"><title>${ctx.esc(this.tip(p))}<\/title><\/path>`;
        s += `<circle cx="${x}" cy="${y}" r="15" fill="${ok ? '#16a34a' : '#dc2626'}" stroke="#fff" stroke-width="3"/>${TXT(x, y + 5, ok ? '+' + p.yards : p.result === 'sack' ? '24' : '✕', { size: 13 })}<\/g>`;
      });
      const last = plays[plays.length - 1], isNew = last && plays.length - 1 > lastDrawn;
      if (isNew) s += `<g id="kball"><circle r="13" fill="#ea580c" stroke="#7c2d12" stroke-width="2"/><path d="M -13 0 H 13 M 0 -13 V 13" stroke="#7c2d12" stroke-width="1.5"/><\/g>`;
      if (last && last.td && done) s += TXT(300, 360, '🔥 EN LLAMAS', { size: 34, font: 'Darker Grotesque, sans-serif', stroke: '#0f172a', sw: 6 });
      svg.innerHTML = s;
      svg.querySelectorAll('g[data-play]').forEach(g => { const i = +g.dataset.play; g.addEventListener('click', () => onPlay(i)); g.addEventListener('mouseenter', () => onPlay(i)); });
      if (isNew && last.result !== 'sack') animateBall(svg, `kp${plays.length - 1}`, 'kball', { dur: 1100, lift: 0.5, done: () => { const b = svg.querySelector('#kball'); if (b) b.remove(); if (last.result === 'gain') { const h = svg.querySelector('#hoop'); if (h) h.classList.add('td-flash'); } } });
      else if (isNew) { const b = svg.querySelector('#kball'); if (b) b.remove(); }
    }
  };

  // =====================================================================================================
  // MLB: diamante. Sencillo, doble, triple, jonrón; las carreras son el bono. 3 outs = fin.
  // =====================================================================================================
  const HOME = { x: 300, y: 520 }, BASES = [[400, 420], [300, 320], [200, 420]];
  const MLB_BASES = { 1: 1, 2: 2, 3: 3, 4: 4, 5: 4 }, RUN_BONUS = 20;
  const MLB_LAND = { 1: [[210, 260], [395, 255]], 2: [[150, 205], [450, 200]], 3: [[95, 260], [505, 255]], 4: [[220, 120], [380, 115]], 5: [[300, 30], [300, 30]] };
  SKINS.mlb = {
    id: 'mlb', kind: 'diamond', scroll: false, aspect: '1 / 1', strikeLabel: 'OUTS', nombre: 'MLB', sticker: 'beis', hudLabel: 'CARRERAS',
    subtitle: 'Responde lo más nicho posible: entre más rara tu respuesta, más lejos se va la pelota.',
    types: T(['Sencillo', 'Doble', 'Triple', 'Jonrón', 'Jonrón de 450 pies'], ['⚾', '✌️', '🏃', '💣', '🚀']),
    fail: { inc: { name: 'Ponche', emoji: 'K', text: 'Se acabaron los intentos: out.' }, sack: { name: 'Doble play', emoji: '🛑', text: 'Se acabó el reloj: out y se borra tu corredor más adelantado.' } },
    init: () => ({ bases: [0, 0, 0], runs: 0 }),
    ballLabel: st => `${st.runs || 0}`,
    intro: () => `Cinco turnos al bat. Cada respuesta es un batazo: <strong>sencillo<\/strong> si es muy conocida y <strong>jonrón<\/strong> si es nicho; los corredores avanzan y cada <strong>carrera vale +${RUN_BONUS}<\/strong>. Un ponche o un doble play es un out: con 3 outs se acaba la entrada.`,
    gain(st, tier, round) {
      const b = (st.bases || [0, 0, 0]).slice(), n = MLB_BASES[tier];
      let runs = 0;
      for (let i = 2; i >= 0; i--) if (b[i]) { if (i + n >= 3) runs++; else b[i + n] = 1; b[i] = 0; }
      if (n >= 4) runs++; else b[n - 1] = 1;
      const before = st.bases || [0, 0, 0];
      st.bases = b; st.runs = (st.runs || 0) + runs;
      const [x, y] = MLB_LAND[tier][round % 2];
      return { yards: runs, from: 0, to: 0, td: runs > 0, x1: x, y1: y, xb: runs * RUN_BONUS, before };
    },
    inc(st) { return { yards: 0, td: false, xb: 0, before: (st.bases || [0, 0, 0]).slice() }; },
    sack(st) { const before = (st.bases || [0, 0, 0]).slice(); const b = before.slice(); for (let i = 2; i >= 0; i--) if (b[i]) { b[i] = 0; break; } st.bases = b; return { yards: 0, td: false, xb: 0, before }; },
    tip(p) {
      const n = p.round + 1;
      if (p.result !== 'gain') return `Turno ${n}: ${this.fail[p.result].name}`;
      return `Turno ${n}: ${this.types[p.tier].name}${p.yards ? ` · ${p.yards} ${p.yards === 1 ? 'carrera' : 'carreras'}` : ''} con ${p.answer} · tier ${p.tier} · ${p.pts + p.bonus + (p.xb || 0)} pts`;
    },
    eventText: p => (p.yards ? `¡${p.yards} ${p.yards === 1 ? 'CARRERA' : 'CARRERAS'}!` : ''),
    info(st, done, plays) {
      const outs = plays.filter(p => p.result !== 'gain').length;
      return `<span>Carreras: <strong>${st.runs || 0}<\/strong> · Outs: <strong>${outs}<\/strong><\/span><span>${done ? 'Toca un batazo para ver el detalle.' : `Turno <strong>${Math.min(plays.length + 1, 5)}<\/strong> de 5`}<\/span>`;
    },
    summaryTitle: (st, won) => (won ? `¡Entrada completada con ${st.runs || 0} ${(st.runs || 0) === 1 ? 'carrera' : 'carreras'}!` : '¡Tres outs!'),
    render(svg, st, ctx) {
      const { plays, done, lastDrawn, onPlay } = ctx;
      svg.setAttribute('viewBox', '0 0 600 600');
      let s = `<rect width="600" height="600" fill="#14532d"/>`;
      s += `<path d="M ${HOME.x} ${HOME.y} L 40 260 A 368 368 0 0 1 560 260 Z" fill="#2f8a3c"/>`;
      for (let k = 0; k < 9; k++) s += `<path d="M ${HOME.x} ${HOME.y} L ${40 + k * 65} 260 L ${72 + k * 65} 260 Z" fill="#287a34" opacity="0.5"/>`;
      s += `<path d="M 40 260 A 368 368 0 0 1 560 260" fill="none" stroke="#fde047" stroke-width="6"/>` + TXT(300, 135, '400 ft', { size: 14, op: 0.7 });
      s += `<path d="M ${HOME.x} ${HOME.y} L 410 430 A 150 150 0 0 0 190 430 Z" fill="#b5793f"/>`;
      s += `<path d="M ${HOME.x} ${HOME.y} L 400 420 L 300 320 L 200 420 Z" fill="#2f8a3c" stroke="#ffffff" stroke-width="3"/>`;
      s += `<line x1="${HOME.x}" y1="${HOME.y}" x2="20" y2="220" stroke="#fff" stroke-width="3"/><line x1="${HOME.x}" y1="${HOME.y}" x2="580" y2="220" stroke="#fff" stroke-width="3"/>`;
      s += `<circle cx="300" cy="420" r="16" fill="#b5793f"/><rect x="292" y="417" width="16" height="5" fill="#fff"/>`;
      s += `<path d="M 290 512 L 310 512 L 310 522 L 300 532 L 290 522 Z" fill="#fff"/>`;
      const bases = (st.bases || [0, 0, 0]);
      BASES.forEach(([x, y], i) => {
        s += `<rect x="${x - 10}" y="${y - 10}" width="20" height="20" fill="#fff" transform="rotate(45 ${x} ${y})"/>`;
        if (bases[i]) s += `<g><circle cx="${x}" cy="${y - 22}" r="11" fill="#00593f" stroke="#fff" stroke-width="3"/>${TXT(x, y - 18, '🏃', { size: 12 })}<\/g>`;
      });
      s += TXT(510, 560, `${st.runs || 0} C`, { size: 26, font: 'Darker Grotesque, sans-serif', stroke: '#0f172a', sw: 5 });
      plays.forEach((p, i) => {
        if (p.result !== 'gain') { s += `<g data-play="${i}" style="cursor:pointer">${TXT(70 + i * 34, 590, p.result === 'inc' ? 'K' : 'DP', { fill: '#fecaca', size: 18, stroke: '#0f172a', sw: 4 })}<title>${ctx.esc(this.tip(p))}<\/title><\/g>`; return; }
        const x = p.x1, y = p.y1, d = `M ${HOME.x} ${HOME.y} Q ${(HOME.x + x) / 2} ${Math.min(HOME.y, y) - (p.tier >= 4 ? 170 : 70)} ${x} ${y}`;
        s += `<g data-play="${i}" style="cursor:pointer"><path id="kp${i}" d="${d}" fill="none" stroke="${COLORS[p.tier]}" stroke-width="4" opacity="0.9"><title>${ctx.esc(this.tip(p))}<\/title><\/path>`;
        s += `<circle cx="${x}" cy="${y}" r="13" fill="${COLORS[p.tier]}" stroke="#0f172a" stroke-width="2"/>${TXT(x, y + 4, i + 1, { fill: '#0f172a', size: 12 })}<\/g>`;
      });
      const last = plays[plays.length - 1], isNew = last && plays.length - 1 > lastDrawn && last.result === 'gain';
      if (isNew) s += `<g id="kball"><circle r="8" fill="#fff" stroke="#dc2626" stroke-width="2"/><\/g>`;
      svg.innerHTML = s;
      svg.querySelectorAll('g[data-play]').forEach(g => { const i = +g.dataset.play; g.addEventListener('click', () => onPlay(i)); g.addEventListener('mouseenter', () => onPlay(i)); });
      if (isNew) animateBall(svg, `kp${plays.length - 1}`, 'kball', { dur: 1000 + last.tier * 150, lift: 1.2, done: () => { const b = svg.querySelector('#kball'); if (b) b.remove(); } });
    }
  };

  // =====================================================================================================
  // F1: parrilla de 20; cada respuesta es una remontada. Podio +30, victoria +40.
  // =====================================================================================================
  const F1_GAIN = { 1: 1, 2: 2, 3: 4, 4: 6, 5: 9 };
  const slot = pos => ({ x: pos % 2 ? 235 : 365, y: 70 + (pos - 1) * 34 });
  SKINS.f1 = {
    id: 'f1', kind: 'grid', scroll: false, aspect: '600 / 760', strikeLabel: 'FALLAS', nombre: 'Fórmula 1', sticker: 'isacbot', hudLabel: 'POSICIÓN',
    subtitle: 'Responde lo más nicho posible: entre más rara tu respuesta, más autos rebasas.',
    types: T(['Rebase en recta', 'Doble rebase', 'Undercut perfecto', 'Estrategia maestra', 'Remontada histórica'], ['🏎️', '✌️', '🔧', '🧠', '🚀']),
    fail: { inc: { name: 'Sin rebase', emoji: '✕', text: 'Se acabaron los intentos: te quedas en tu posición.' }, sack: { name: 'Trompo', emoji: '🌀', text: 'Se acabó el reloj: pierdes 2 posiciones.' } },
    init: () => ({ pos: 20, podio: false, win: false }),
    ballLabel: st => `P${st.pos || 20}`,
    intro: () => `Sales último (P20). Cada respuesta es una vuelta: entre más nicho, más autos rebasas (de 1 hasta 9). Llegar al <strong>podio<\/strong> = +30 y ganar la carrera (<strong>P1<\/strong>) = +40.`,
    gain(st, tier) {
      const from = st.pos || 20, to = Math.max(1, from - F1_GAIN[tier]);
      let xb = 0;
      if (to <= 3 && !st.podio) { st.podio = true; xb += 30; }
      if (to === 1 && !st.win) { st.win = true; xb += 40; }
      st.pos = to;
      return { yards: from - to, from, to, td: xb > 0, xb };
    },
    inc(st) { return { yards: 0, from: st.pos || 20, to: st.pos || 20, td: false, xb: 0 }; },
    sack(st) { const from = st.pos || 20; st.pos = Math.min(20, from + 2); return { yards: -(st.pos - from), from, to: st.pos, td: false, xb: 0 }; },
    tip(p) {
      const n = p.round + 1;
      if (p.result === 'sack') return `Vuelta ${n}: Trompo (P${p.from} → P${p.to})`;
      if (p.result === 'inc') return `Vuelta ${n}: Sin rebase (P${p.from})`;
      return `Vuelta ${n}: ${this.types[p.tier].name} (P${p.from} → P${p.to}) con ${p.answer} · tier ${p.tier} · ${p.pts + p.bonus + (p.xb || 0)} pts`;
    },
    eventText: p => (p.to === 1 && p.xb ? '¡VICTORIA!' : p.xb ? '¡PODIO!' : ''),
    info(st, done, plays) {
      return `<span>Vas en <strong>P${st.pos || 20}<\/strong>${st.win ? ' · 🏆 ganaste' : st.podio ? ' · 🥉 podio' : ''}<\/span><span>${done ? 'Toca una vuelta para ver el detalle.' : `Vuelta <strong>${Math.min(plays.length + 1, 5)}<\/strong> de 5`}<\/span>`;
    },
    summaryTitle: (st, won) => (won ? (st.win ? '¡Ganaste la carrera desde P20!' : `¡Terminaste en P${st.pos}!`) : 'Abandono'),
    render(svg, st, ctx) {
      const { plays, done, lastDrawn, onPlay } = ctx;
      svg.setAttribute('viewBox', '0 0 600 760');
      let s = `<rect width="600" height="760" fill="#14532d"/><rect x="150" y="0" width="300" height="760" fill="#334155"/>`;
      s += `<rect x="150" y="0" width="300" height="760" fill="none" stroke="#ffffff" stroke-width="6"/>`;
      for (let i = 0; i < 40; i++) s += `<rect x="${i % 2 ? 138 : 450}" y="${i * 19}" width="12" height="19" fill="${i % 2 ? '#dc2626' : '#ffffff'}"/><rect x="${i % 2 ? 450 : 138}" y="${i * 19}" width="12" height="19" fill="${i % 2 ? '#ffffff' : '#dc2626'}"/>`;
      for (let i = 0; i < 12; i++) s += `<rect x="${150 + i * 25}" y="${i % 2 ? 30 : 42}" width="25" height="12" fill="#fff"/>`;
      s += `<rect x="150" y="54" width="300" height="104" fill="#fde047" opacity="0.12"/>` + TXT(500, 110, 'PODIO', { size: 16, fill: '#fde047' });
      const me = done || !plays.length ? (st.pos || 20) : (plays[plays.length - 1].to);
      for (let pos = 1; pos <= 20; pos++) {
        const { x, y } = slot(pos);
        s += `<line x1="${x - 34}" y1="${y - 14}" x2="${x + 34}" y2="${y - 14}" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>` + TXT(pos % 2 ? 175 : 425, y + 5, 'P' + pos, { size: 11, op: 0.7 });
        if (pos !== me) s += `<rect x="${x - 12}" y="${y - 10}" width="24" height="30" rx="7" fill="#94a3b8"/>`;
      }
      if (!done) [1, 2, 3, 4, 5].forEach(t => { const p = Math.max(1, (st.pos || 20) - F1_GAIN[t]), { y } = slot(p); s += `<g opacity="0.85"><circle cx="${560}" cy="${y + 4}" r="13" fill="${COLORS[t]}"/>${TXT(560, y + 8, 'T' + t, { fill: '#0f172a', size: 11 })}<line x1="470" y1="${y + 4}" x2="545" y2="${y + 4}" stroke="${COLORS[t]}" stroke-dasharray="4 4" stroke-width="2"/><\/g>`; });
      plays.forEach((p, i) => { s += `<g data-play="${i}" style="cursor:pointer">${TXT(40, 70 + i * 40, `${i + 1}·P${p.to}`, { size: 14, fill: p.result === 'gain' ? COLORS[p.tier] : '#fecaca', anchor: 'start' })}<title>${ctx.esc(this.tip(p))}<\/title><\/g>`; });
      const last = plays[plays.length - 1], isNew = last && plays.length - 1 > lastDrawn;
      const a = slot(isNew ? last.from : me), b = slot(me);
      s += `<path id="kcar-path" d="M ${a.x} ${a.y + 5} C ${a.x} ${(a.y + b.y) / 2} ${b.x} ${(a.y + b.y) / 2} ${b.x} ${b.y + 5}" fill="none"/>`;
      s += `<g id="kcar" transform="translate(${a.x} ${a.y + 5})"><rect x="-14" y="-17" width="28" height="36" rx="8" fill="#00593f" stroke="#fde047" stroke-width="3"/>${TXT(0, 6, 'ISAC', { size: 9 })}<\/g>`;
      svg.innerHTML = s;
      svg.querySelectorAll('g[data-play]').forEach(g => { const i = +g.dataset.play; g.addEventListener('click', () => onPlay(i)); g.addEventListener('mouseenter', () => onPlay(i)); });
      if (isNew) animateBall(svg, 'kcar-path', 'kcar', { dur: 900 + Math.abs(last.from - last.to) * 90 });
      else { const c = svg.querySelector('#kcar'); if (c) c.setAttribute('transform', `translate(${b.x} ${b.y + 5})`); }
    }

      img.onload = () => {

    const norm = s => String(s).normalize('NFD').replace(/[^\x00-\x7f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

    function lev(a, b, max) {
      if (Math.abs(a.length - b.length) > max) return max + 1;
      let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        const cur = [i];
        let best = i;
        for (let j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          if (cur[j] < best) best = cur[j];
        }
        if (best > max) return max + 1;
        prev = cur;
      }
      return prev[b.length];

    function matchAnswer(round, guess) {

      if (!g) return null;
      for (const a of round.answers) {

      }
      if (g.length < 5) return null;
      const tol = g.length >= 10 ? 2 : 1;
      const hits = new Set();
      round.answers.forEach(a => {
        [a.name, ...(a.aliases || [])].forEach(x => {
          const k = norm(x);
          if (k.length >= 5 && lev(g, k, tol) <= tol) hits.add(a);
        });
      });
      return hits.size === 1 ? [...hits][0] : null;

        <div class="emoji-recap">${st.plays.map(emojiFor).join(' ')}</div>
        <ul class="recap-list">
          ${st.plays.map(p => `<li><span class="q">${p.round + 1}. ${esc(puzzle.rounds[p.round].prompt)}</span><br/>${emojiFor(p)} ${esc(playTip(p).replace(/^Jugada \d+: /, ''))}</li>`).join('')}
        </ul>
        <div style="margin-bottom:1rem;"><button class="btn-share" onclick="shareResult()">Compartir resultado 📋</button></div>
        ${won && !isArchive && !st.scoreSubmitted ? `
          <div style="margin:1rem 0;">
            <input id="nick-input" class="nick-input" value="${esc(savedNick)}" placeholder="Tu nickname..." maxlength="18" />
            <button id="submit-btn" class="btn-primary" onclick="saveScore()">Guardar en Scoreboard</button>
            <div id="submit-err" class="err-msg"></div>
          </div>` : ''}
        <div class="board-header">
          <h3 style="margin:0;">Ranking Global (${puzzle.date}) — ISAC-Krillion</h3>
          <button class="btn-sec" onclick="refreshBoard()">Actualizar ranking</button>
        </div>
        ${leaderboard.length ? `
          <table>
            <thead><tr><th>#</th><th>Jugador</th><th>Strikes</th><th>Tiempo</th><th>Puntos</th></tr></thead>
            <tbody>
              ${leaderboard.map((r, i) => `
                <tr class="${r.device_id === myId ? 'me' : ''}">
                  <td>${i + 1}</td>
                  <td>${esc(r.nickname)} ${r.device_id === myId ? '(Tú)' : ''}</td>
                  <td>${r.attempts}</td>
                  <td>${fmtTime(r.time_seconds)}</td>
                  <td><strong>${r.score}</strong></td>
                </tr>`).join('')}
            </tbody>
          </table>` : '<p style="color:#475569;font-size:0.9rem;">Aún no hay drives registrados hoy. ¡Sé el primero!</p>'}
      `;
    }

    window.saveScore = async () => {
      /*isac-score-guard*/ const _hoy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' }); if (puzzle.date !== _hoy) { console.warn('[guard] score no registrado: dia no vigente'); const _ge = document.getElementById('submit-err'); if (_ge) _ge.textContent = 'Este dia ya no esta vigente: tu puntaje no se registro.'; return; }
      const nickInput = document.getElementById('nick-input');
      const errEl = document.getElementById('submit-err');
      const btn = document.getElementById('submit-btn');
      const nick = nickInput.value.trim();
      if (!isWon()) return;
      if (nick.length < 2) { errEl.textContent = 'Escribe un nickname de al menos 2 caracteres.'; return; }
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      errEl.textContent = '';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/game_scores`, {
          method: 'POST',
          headers: { ...SB_HEADERS, Prefer: 'return=minimal' },
          body: JSON.stringify({
            game_id: GAME_ID,
            puzzle_date: puzzle.date,
            nickname: nick,
            device_id: getDeviceId(),
            score: calcScore(),
            attempts: strikes(),
            time_seconds: Math.max(1, st.elapsed)
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          if (errData.code === '23505') throw new Error('Ya registraste tu resultado hoy desde este dispositivo.');
          throw new Error(errData.message || 'Error al guardar puntaje.');
        }
        localStorage.setItem('isac_player_nickname', nick);
        st.scoreSubmitted = true;
        saveLocal();
        await fetchLeaderboard(puzzle.date);
        renderSummary();
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Guardar en Scoreboard';
      }
    };

    init();
  </script>
</body>
</html>
