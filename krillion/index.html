    const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

    function lev(a, b, max) {
      if (Math.abs(a.length - b.length) > max) return max + 1;
      let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        const cur = [i];
        let best = i;
        for (let j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          if (cur[j] < best) best = cur[j];
        }
        if (best > max) return max + 1;
        prev = cur;
      }
      return prev[b.length];
    }

    // Devuelve la respuesta (objeto) o null. Exacta por nombre/alias; si no, tolera 1 error de dedo (2 en textos largos)
    function matchAnswer(round, guess) {
      const g = norm(guess);
      if (!g) return null;
      for (const a of round.answers) {
        if ([a.name, ...(a.aliases || [])].some(x => norm(x) === g)) return a;
      }
      if (g.length < 5) return null;
      const tol = g.length >= 10 ? 2 : 1;
      const hits = new Set();
      round.answers.forEach(a => {
        [a.name, ...(a.aliases || [])].forEach(x => {
          const k = norm(x);
          if (k.length >= 5 && lev(g, k, tol) <= tol) hits.add(a);
        });
      });
      return hits.size === 1 ? [...hits][0] : null;
    }

    function getDeviceId() {
      let id = localStorage.getItem('isac_device_id');
      if (!id) {
        id = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
              const r = Math.random() * 16 | 0;
              return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        localStorage.setItem('isac_device_id', id);
      }
      return id;
    }

    let toastTimer = null;
    function showToast(msg, type = '') {
      const bar = document.getElementById('toast-bar');
      bar.innerHTML = `<div class="toast-msg ${type}">${msg}</div>`;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { bar.innerHTML = ''; }, 2800);
    }

    // ---------- estado ----------
    let puzzle = null;
    let st = null;
    let ticker = null;
    let leaderboard = [];
    let lastDrawn = -1;

    const freshState = () => ({ phase: 'intro', round: 0, deadline: 0, tries: TRIES, wrong: [], plays: [], yard: START_YARD, tds: 0, elapsed: 0, scoreSubmitted: false });
    const storeKey = d => `isac_krillion_v1_${d}`;
    const saveLocal = () => localStorage.setItem(storeKey(puzzle.date), JSON.stringify(st));

    const strikes = () => st.plays.filter(p => p.result !== 'gain').length;
    const isLost = () => strikes() >= MAX_STRIKES;
    const isDone = () => isLost() || st.plays.length >= ROUNDS;
    const isWon = () => isDone() && !isLost();
    const rawScore = () => st.plays.reduce((s, p) => s + p.pts + p.bonus, 0) + st.tds * TD_BONUS;
    const calcScore = () => (isWon() ? rawScore() : 0);

    async function fetchLeaderboard(dateStr) {
      leaderboard = [];
      try {
        const url = `${SUPABASE_URL}/rest/v1/game_scores?select=nickname,score,attempts,time_seconds,device_id&game_id=eq.${GAME_ID}&puzzle_date=eq.${dateStr}&order=score.desc,time_seconds.asc&limit=10`;
        const res = await fetch(url, { headers: SB_HEADERS, cache: 'no-store' });
        if (res.ok) leaderboard = await res.json();
      } catch (e) {
        console.warn('No se pudo cargar el ranking remoto:', e);
      }
    }

    async function init() {
      setBotMood('saluda');
      const sel = document.getElementById('date-select');
      EMBEDDED_INDEX.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.date;
        opt.textContent = `${item.date} ${item.date === todayStr ? '(Hoy)' : ''}`;
        sel.appendChild(opt);
      });
      const hasToday = EMBEDDED_INDEX.some(i => i.date === todayStr);
      const initial = hasToday ? todayStr : EMBEDDED_INDEX[0].date;
      sel.value = initial;
      sel.onchange = () => loadDay(sel.value);
      renderLegend();
      await loadDay(initial);
    }

    window.goToday = async () => {
      const hasToday = EMBEDDED_INDEX.some(i => i.date === todayStr);
      await loadDay(hasToday ? todayStr : EMBEDDED_INDEX[0].date);
    };

    window.refreshBoard = async () => {
      await fetchLeaderboard(puzzle.date);
      renderSummary();
    };

    async function loadDay(dateStr) {
      stopTicker();
      document.getElementById('date-select').value = dateStr;
      puzzle = EMBEDDED_PUZZLES[dateStr];
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(storeKey(dateStr)) || 'null'); } catch (e) { saved = null; }
      st = saved && Array.isArray(saved.plays) ? { ...freshState(), ...saved } : freshState();
      lastDrawn = st.plays.length - 1;

      document.getElementById('theme-pill').textContent = `Tema: ${puzzle.theme}`;
      const banner = document.getElementById('archive-banner');
      const btnToday = document.getElementById('btn-today');
      if (puzzle.date !== todayStr) {
        banner.innerHTML = `<span>Estás jugando en <strong>Modo Archivo (${puzzle.date})</strong>. Esta partida no suma al ranking diario.</span><button class="btn-today" onclick="goToday()">Volver a Hoy</button>`;
        banner.classList.remove('hidden');
        btnToday.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
        btnToday.classList.add('hidden');
      }

      await fetchLeaderboard(puzzle.date);
      if (leaderboard.some(r => r.device_id === getDeviceId())) st.scoreSubmitted = true;

      // si se recargo la pagina con una jugada en curso, el reloj siguio corriendo
      if (st.phase === 'play' && Date.now() >= st.deadline) {
        resolveSack(true);
        showToast('Saliste con una jugada en curso y se acabó el reloj: sack.', 'bad');
      }

      if (isDone()) { st.phase = 'done'; setBotMood(isWon() ? 'celebracion' : 'facepalm'); }
      else if (st.phase === 'intro') setBotMood(puzzle.sport || 'saluda');
      else setBotMood('pensativo');

      renderAll();
      if (st.phase === 'play') startTicker();
    }

    // ---------- flujo de juego ----------
    window.startDrive = () => {
      if (st.phase !== 'intro') return;
      startPlay();
    };

    function startPlay() {
      st.phase = 'play';
      st.tries = TRIES;
      st.wrong = [];
      st.deadline = Date.now() + ROUND_SECONDS * 1000;
      saveLocal();
      setBotMood('pensativo');
      renderAll();
      startTicker();
      const inp = document.getElementById('answer-input');
      if (inp) inp.focus();
    }

    window.nextPlay = () => {
      if (st.phase !== 'result' || isDone()) return;
      st.round++;
      startPlay();
    };

    function secsLeft() { return Math.max(0, Math.ceil((st.deadline - Date.now()) / 1000)); }

    function startTicker() {
      stopTicker();
      ticker = setInterval(() => {
        if (st.phase !== 'play') { stopTicker(); return; }
        if (Date.now() >= st.deadline) { resolveSack(false); return; }
        renderTimer();
      }, 200);
      renderTimer();
    }
    function stopTicker() { if (ticker) clearInterval(ticker); ticker = null; }

    function pushPlay(play) {
      st.plays.push(play);
      st.elapsed += play.used;
      st.phase = isDone() ? 'done' : 'result';
      saveLocal();
    }

    function resolveSack(silent) {
      stopTicker();
      const from = st.yard;
      st.yard = Math.max(1, st.yard - SACK_YARDS);
      pushPlay({ round: st.round, result: 'sack', answer: null, tier: 0, yards: -(from - st.yard), from, to: st.yard, td: false, pts: 0, bonus: 0, used: ROUND_SECONDS });
      if (!silent) {
        setBotMood('facepalm');
        showToast(`¡Sack! Se acabó el reloj: ${from - st.yard} yardas de pérdida.`, 'bad');
        renderAll();
      }
    }

    window.submitAnswer = () => {
      if (st.phase !== 'play') return;
      if (Date.now() >= st.deadline) { resolveSack(false); return; }
      const inp = document.getElementById('answer-input');
      const raw = inp.value.trim();
      if (!raw) return;
      const round = puzzle.rounds[st.round];
      const hit = matchAnswer(round, raw);
      if (hit) {
        stopTicker();
        const left = secsLeft();
        const pt = PLAY_TYPES[hit.tier];
        const from = st.yard;
        let to = from + pt.yd;
        let td = false;
        if (to >= 100) { td = true; st.tds++; }
        st.yard = td ? START_YARD : to;
        pushPlay({ round: st.round, result: 'gain', answer: hit.name, tier: hit.tier, yards: pt.yd, from, to: Math.min(to, 100), td, pts: pt.pts, bonus: Math.min(10, Math.floor(left / 3)), used: ROUND_SECONDS - left });
        setBotMood('celebracion');
        showToast(td ? `¡TOUCHDOWN! ${pt.emoji} ${pt.name} con ${esc(hit.name)}` : `${pt.emoji} ${pt.name}: ${esc(hit.name)} (+${pt.yd} yd)`, 'ok');
        renderAll();
        return;
      }
      const key = norm(raw);
      if (st.wrong.some(w => norm(w) === key)) { showToast('Ya intentaste esa respuesta.', 'warn'); inp.select(); return; }
      st.wrong.push(raw);
      st.tries--;
      setBotMood('facepalm');
      if (st.tries <= 0) {
        stopTicker();
        const left = secsLeft();
        pushPlay({ round: st.round, result: 'inc', answer: null, tier: 0, yards: 0, from: st.yard, to: st.yard, td: false, pts: 0, bonus: 0, used: ROUND_SECONDS - left });
        showToast('Pase incompleto: se acabaron los intentos de esta jugada.', 'bad');
        renderAll();
        return;
      }
      saveLocal();
      showToast(`"${esc(raw)}" no está en la lista. Te quedan ${st.tries} ${st.tries === 1 ? 'intento' : 'intentos'}.`, 'warn');
      renderStage();
      const inp2 = document.getElementById('answer-input');
      if (inp2) { inp2.classList.add('shake'); setTimeout(() => inp2.classList.remove('shake'), 400); inp2.focus(); }
    };

    // ---------- render ----------
    function renderAll() {
      renderHud();
      renderField();
      renderStage();
      renderSummary();
    }

    function renderHud() {
      document.getElementById('hud-score').textContent = isLost() ? 0 : rawScore();
      document.getElementById('hud-yard').textContent = yardLabel(st.yard);
      document.getElementById('hud-strikes').textContent = `${strikes()} / ${MAX_STRIKES}`;
      document.getElementById('hud-time').textContent = fmtTime(st.elapsed);
    }

    // yarda propia 1-49 -> "Propia 25"; 50 -> "50"; 51-99 -> "Rival 30"
    const yardLabel = y => (y < 50 ? `P${y}` : y === 50 ? '50' : `R${100 - y}`);

    function renderLegend() {
      document.getElementById('legend').innerHTML = [1, 2, 3, 4, 5].map(t => {
        const p = PLAY_TYPES[t];
        return `<span class="chip" style="background:${p.color}">T${t} · ${p.emoji} ${p.short} ${p.yd} yd · ${p.pts} pts</span>`;
      }).join('') + `<span class="chip" style="background:#fecaca">✕ Incompleto 0 yd</span><span class="chip" style="background:#fca5a5">🛑 Sack −${SACK_YARDS} yd</span>`;
    }

    const X = y => 100 + y * 10;               // yarda propia -> x del SVG
    const laneY = i => 78 + i * 60;

    function playPath(p, i) {
      const y = laneY(i);
      const x1 = X(p.from);
      if (p.result === 'sack') return { d: `M ${x1} ${y} L ${X(p.to)} ${y}`, color: '#ef4444', dash: '' };
      if (p.result === 'inc') {
        const x2 = Math.min(1090, x1 + 120);
        return { d: `M ${x1} ${y} Q ${(x1 + x2) / 2} ${y - 50} ${x2} ${y}`, color: '#fecaca', dash: '10 10', x2 };
      }
      const x2 = p.td ? 1150 : X(p.to);
      const color = PLAY_TYPES[p.tier].color;
      if (p.tier === 1) return { d: `M ${x1} ${y} L ${x2} ${y}`, color, dash: '' };
      const h = Math.min(62, 18 + (x2 - x1) * 0.12);
      return { d: `M ${x1} ${y} Q ${(x1 + x2) / 2} ${y - h} ${x2} ${y}`, color, dash: '' };
    }

    function renderField() {
      const svg = document.getElementById('field-svg');
      let s = '';
      s += `<rect x="0" y="0" width="1200" height="400" fill="#2f7d4f"/>`;
      for (let i = 0; i < 10; i++) if (i % 2 === 0) s += `<rect x="${100 + i * 100}" y="0" width="100" height="400" fill="#2a7348"/>`;
      s += `<rect x="0" y="0" width="100" height="400" fill="#00593f"/>`;
      s += `<rect id="endzone" x="1100" y="0" width="100" height="400" fill="#00593f"/>`;
      s += `<text x="50" y="200" fill="#a7f3d0" font-family="Darker Grotesque, sans-serif" font-weight="800" font-size="44" text-anchor="middle" transform="rotate(-90 50 200)" opacity="0.8">ISAC</text>`;
      s += `<text x="1150" y="200" fill="#ecfdf5" font-family="Darker Grotesque, sans-serif" font-weight="800" font-size="44" text-anchor="middle" transform="rotate(90 1150 200)" opacity="0.35">KRILLION</text>`;
      for (let yd = 0; yd <= 100; yd += 5) {
        const x = X(yd);
        s += `<line x1="${x}" y1="0" x2="${x}" y2="400" stroke="#ffffff" stroke-opacity="${yd % 10 === 0 ? 0.75 : 0.35}" stroke-width="${yd % 10 === 0 ? 3 : 1.5}"/>`;
        if (yd % 10 === 0 && yd > 0 && yd < 100) {
          const n = yd <= 50 ? yd : 100 - yd;
          s += `<text x="${x}" y="30" fill="#ffffff" fill-opacity="0.8" font-family="Sora, sans-serif" font-weight="700" font-size="22" text-anchor="middle">${n}</text>`;
          s += `<text x="${x}" y="388" fill="#ffffff" fill-opacity="0.8" font-family="Sora, sans-serif" font-weight="700" font-size="22" text-anchor="middle">${n}</text>`;
        }
      }
      for (let yd = 1; yd < 100; yd++) {
        const x = X(yd);
        s += `<line x1="${x}" y1="150" x2="${x}" y2="158" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/><line x1="${x}" y1="242" x2="${x}" y2="250" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>`;
      }
      // jugadas
      st.plays.forEach((p, i) => {
        const g = playPath(p, i);
        const isNew = i > lastDrawn;
        const tip = playTip(p);
        s += `<g data-play="${i}">`;
        s += `<path class="play-path${isNew ? ' new' : ''}" d="${g.d}" stroke="${g.color}" ${g.dash ? `stroke-dasharray="${g.dash}"` : ''} data-len="1"><title>${esc(tip)}</title></path>`;
        s += `<path class="play-hit" d="${g.d}"><title>${esc(tip)}</title></path>`;
        s += `<circle cx="${X(p.from)}" cy="${laneY(i)}" r="7" fill="#ffffff"/>`;
        if (p.result === 'inc') s += `<text x="${g.x2}" y="${laneY(i) + 9}" fill="#fecaca" font-size="28" font-weight="800" text-anchor="middle">✕</text>`;
        if (p.td) s += `<text x="1150" y="${laneY(i) - 14}" fill="#fde047" stroke="#0f172a" stroke-width="5" paint-order="stroke" font-family="Darker Grotesque, sans-serif" font-size="38" font-weight="800" text-anchor="middle">TD</text>`;
        s += `<text x="${X(p.from) - 14}" y="${laneY(i) + 6}" fill="#ffffff" font-family="Sora, sans-serif" font-size="16" font-weight="800" text-anchor="end">${i + 1}</text>`;
        s += `</g>`;
      });
      // linea de golpeo y guias de la jugada en curso
      if (!isDone()) {
        const xl = X(st.yard);
        s += `<line x1="${xl}" y1="0" x2="${xl}" y2="400" stroke="#60a5fa" stroke-width="4"/>`;
        if (st.phase === 'play' || st.phase === 'intro' || st.phase === 'result') {
          const y = laneY(Math.min(st.plays.length, ROUNDS - 1));
          [1, 2, 3, 4, 5].forEach(t => {
            const to = st.yard + PLAY_TYPES[t].yd;
            const xg = to >= 100 ? 1150 : X(to);
            s += `<g class="ghost"><line x1="${xg}" y1="${y - 26}" x2="${xg}" y2="${y + 12}" stroke="${PLAY_TYPES[t].color}" stroke-width="2" stroke-dasharray="4 4"/><circle cx="${xg}" cy="${y - 26}" r="11" fill="${PLAY_TYPES[t].color}" stroke="#0f172a" stroke-opacity="0.3"/><text x="${xg}" y="${y - 21}" font-family="Sora, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#0f172a">T${t}</text></g>`;
          });
          s += `<g><ellipse cx="${xl}" cy="${y}" rx="16" ry="10" fill="#7c2d12" stroke="#ffffff" stroke-width="2"/><line x1="${xl - 7}" y1="${y}" x2="${xl + 7}" y2="${y}" stroke="#ffffff" stroke-width="2"/></g>`;
        }
      }
      svg.innerHTML = s;
      svg.querySelectorAll('.play-path.new').forEach(el => {
        const len = el.getTotalLength ? el.getTotalLength() : 0;
        if (!el.getAttribute('stroke-dasharray')) { el.style.strokeDasharray = len; el.style.strokeDashoffset = len; }
        else el.classList.remove('new');
      });
      if (st.plays.length && st.plays[st.plays.length - 1].td && st.plays.length - 1 > lastDrawn) {
        const ez = document.getElementById('endzone');
        if (ez) ez.classList.add('td-flash');
      }
      lastDrawn = st.plays.length - 1;
      svg.querySelectorAll('g[data-play]').forEach(g => {
        g.addEventListener('click', () => showPlayInfo(parseInt(g.dataset.play, 10)));
        g.addEventListener('mouseenter', () => showPlayInfo(parseInt(g.dataset.play, 10)));
      });
      renderFieldInfo();
    }

    function playTip(p) {
      const n = p.round + 1;
      if (p.result === 'sack') return `Jugada ${n}: Sack (−${Math.abs(p.yards)} yd), se acabó el reloj`;
      if (p.result === 'inc') return `Jugada ${n}: Pase incompleto (0 yd)`;
      return `Jugada ${n}: ${PLAY_TYPES[p.tier].name} (+${p.yards} yd${p.td ? ', TOUCHDOWN' : ''}) con ${p.answer} · tier ${p.tier} · ${p.pts + p.bonus} pts`;
    }

    function showPlayInfo(i) {
      const p = st.plays[i];
      if (!p) return;
      document.getElementById('field-info').innerHTML = `<span><strong>${esc(playTip(p))}</strong></span>`;
    }

    function renderFieldInfo() {
      const info = document.getElementById('field-info');
      if (isDone()) {
        info.innerHTML = `<span>Toca o pasa el cursor sobre una jugada para ver el detalle.</span><span><strong>${st.tds}</strong> TD · <strong>${st.plays.filter(p => p.result === 'gain').reduce((s, p) => s + p.yards, 0)}</strong> yd ganadas</span>`;
      } else {
        info.innerHTML = `<span>Balón en tu yarda <strong>${st.yard}</strong> · faltan <strong>${100 - st.yard}</strong> yd para touchdown</span><span>Jugada <strong>${Math.min(st.plays.length + 1, ROUNDS)}</strong> de ${ROUNDS}</span>`;
      }
    }

    function nicheExamples(round, exclude) {
      return round.answers.filter(a => a.tier === 5 && a.name !== exclude).slice(0, 3).map(a => a.name);
    }

    function renderStage() {
      const stage = document.getElementById('stage');
      if (st.phase === 'intro') {
        stage.innerHTML = `
          <div class="card">
            <h2>Tu drive de hoy</h2>
            <p>Arrancas en tu yarda ${START_YARD}. Tienes <strong>${ROUNDS} jugadas</strong>: en cada una te damos una pregunta con muchas respuestas válidas. Entre más <strong>nicho</strong> sea tu respuesta, más yardas avanzas.</p>
            <ul class="rules">
              <li><strong>${ROUND_SECONDS} segundos</strong> y <strong>${TRIES} intentos</strong> por jugada. Una respuesta que no está en la lista gasta un intento.</li>
              <li>Sin intentos: pase incompleto (0 yd). Sin tiempo: <strong>sack</strong> (−${SACK_YARDS} yd).</li>
              <li>3 incompletos o sacks = <strong>turnover on downs</strong>: el drive termina y no entra al ranking.</li>
              <li>Puntos: los de la jugada + bono de tiempo (+1 por cada 3 s sobrantes, máx. +10) + <strong>${TD_BONUS} por touchdown</strong>. Tras un TD el balón vuelve a tu yarda ${START_YARD}.</li>
            </ul>
            <button class="btn-primary" id="btn-start" onclick="startDrive()">Iniciar drive</button>
          </div>`;
        return;
      }
      if (st.phase === 'play') {
        const r = puzzle.rounds[st.round];
        const dots = Array.from({ length: TRIES }, (_, i) => `<span class="life-dot${i < TRIES - st.tries ? ' lost' : ''}"></span>`).join('');
        stage.innerHTML = `
          <div class="card">
            <span class="round-tag">JUGADA ${st.round + 1} DE ${ROUNDS}</span>
            <div class="prompt">${esc(r.prompt)}</div>
            <div class="timer-row"><div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div><span id="timer-num" class="timer-num">${ROUND_SECONDS}</span></div>
            <div class="answer-row">
              <input id="answer-input" class="answer-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta más nicho..." maxlength="60" />
              <button class="btn-primary" id="btn-answer" onclick="submitAnswer()">Jugar</button>
            </div>
            <div class="tries">Intentos: ${dots} ${st.wrong.length ? `<span class="wrong-list">· No cuentan: ${st.wrong.map(esc).join(', ')}</span>` : ''}</div>
          </div>`;
        const inp = document.getElementById('answer-input');
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitAnswer(); });
        renderTimer();
        return;
      }
      if (st.phase === 'result') {
        const p = st.plays[st.plays.length - 1];
        const r = puzzle.rounds[p.round];
        stage.innerHTML = `<div class="card">${playResultHtml(p, r)}<button class="btn-primary" id="btn-next" onclick="nextPlay()">Siguiente jugada</button></div>`;
        return;
      }
      stage.innerHTML = '';
    }

    function playResultHtml(p, r) {
      const niche = nicheExamples(r, p.answer);
      let head;
      if (p.result === 'gain') {
        const pt = PLAY_TYPES[p.tier];
        head = `<div class="play-result"><span class="play-emoji">${p.td ? '🙌' : pt.emoji}</span><div><div class="play-name">${p.td ? '¡TOUCHDOWN!' : pt.name}</div><p>${esc(p.answer)} es tier ${p.tier}: +${p.yards} yd · ${pt.pts} pts + ${p.bonus} de bono${p.td ? ` + ${TD_BONUS} por TD` : ''}.</p></div></div>`;
      } else if (p.result === 'inc') {
        head = `<div class="play-result"><span class="play-emoji">✕</span><div><div class="play-name">Pase incompleto</div><p>Se acabaron los intentos. 0 yardas. Strike ${strikes()} de ${MAX_STRIKES}.</p></div></div>`;
      } else {
        head = `<div class="play-result"><span class="play-emoji">🛑</span><div><div class="play-name">Sack</div><p>Se acabó el reloj: ${Math.abs(p.yards)} yardas de pérdida. Strike ${strikes()} de ${MAX_STRIKES}.</p></div></div>`;
      }
      return `<span class="round-tag">JUGADA ${p.round + 1} DE ${ROUNDS}</span><p class="q"><strong>${esc(r.prompt)}</strong></p>${head}${niche.length ? `<div class="niche">Bombas posibles (tier 5): ${niche.map(esc).join(', ')}. Fuente: ${esc(r.source)}.</div>` : ''}`;
    }

    function renderTimer() {
      const fill = document.getElementById('timer-fill');
      const num = document.getElementById('timer-num');
      if (!fill || !num) return;
      const ms = Math.max(0, st.deadline - Date.now());
      fill.style.width = `${(ms / (ROUND_SECONDS * 1000)) * 100}%`;
      fill.classList.toggle('low', ms <= 10000);
      num.textContent = Math.ceil(ms / 1000);
    }

    const emojiFor = p => (p.result === 'sack' ? '🛑' : p.result === 'inc' ? '✕' : p.td ? '🙌' : PLAY_TYPES[p.tier].emoji);

    window.copyShare = () => {
      const text = `ISAC Krillion · ${puzzle.date}\n${st.plays.map(emojiFor).join('')}\n${isWon() ? `${st.tds} TD · ${calcScore()} pts` : 'Turnover on downs'} · ${fmtTime(st.elapsed)}`;
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('Resultado copiado al portapapeles', 'ok')).catch(() => {});
    };

    function renderSummary() {
      const card = document.getElementById('summary-card');
      if (!isDone()) { card.classList.add('hidden'); return; }
      stopTicker();
      const won = isWon();
      const isArchive = puzzle.date !== todayStr;
      const myId = getDeviceId();
      const savedNick = localStorage.getItem('isac_player_nickname') || '';
      const errores = st.plays.reduce((s, p) => s + (p.result === 'gain' ? 0 : 1), 0);
      card.classList.remove('hidden');
      card.innerHTML = `
        <h2>${won ? (st.tds ? `¡Drive completado con ${st.tds} ${st.tds === 1 ? 'touchdown' : 'touchdowns'}!` : '¡Drive completado!') : 'Turnover on downs'}</h2>
        <p>${won
          ? `Terminaste tus ${ROUNDS} jugadas en <strong>${fmtTime(st.elapsed)}</strong> con <strong>${errores} ${errores === 1 ? 'strike' : 'strikes'}</strong>: <strong>${calcScore()} pts</strong>.`
          : `Llegaste a ${MAX_STRIKES} strikes y perdiste el balón. Este drive no entra al ranking. ¡Mañana hay otro!`}</p>
        <div class="emoji-recap">${st.plays.map(emojiFor).join(' ')}</div>
        <ul class="recap-list">
          ${st.plays.map(p => `<li><span class="q">${p.round + 1}. ${esc(puzzle.rounds[p.round].prompt)}</span><br/>${emojiFor(p)} ${esc(playTip(p).replace(/^Jugada \d+: /, ''))}</li>`).join('')}
        </ul>
        <div style="margin-bottom:1rem;"><button class="btn-sec" onclick="copyShare()">Copiar resultado</button></div>
        ${won && !isArchive && !st.scoreSubmitted ? `
          <div style="margin:1rem 0;">
            <input id="nick-input" class="nick-input" value="${esc(savedNick)}" placeholder="Tu nickname..." maxlength="18" />
            <button id="submit-btn" class="btn-primary" onclick="saveScore()">Guardar en Scoreboard</button>
            <div id="submit-err" class="err-msg"></div>
          </div>` : ''}
        <div class="board-header">
          <h3 style="margin:0;">Ranking Global (${puzzle.date}) — Krillion</h3>
          <button class="btn-sec" onclick="refreshBoard()">Actualizar ranking</button>
        </div>
        ${leaderboard.length ? `
          <table>
            <thead><tr><th>#</th><th>Jugador</th><th>Strikes</th><th>Tiempo</th><th>Puntos</th></tr></thead>
            <tbody>
              ${leaderboard.map((r, i) => `
                <tr class="${r.device_id === myId ? 'me' : ''}">
                  <td>${i + 1}</td>
                  <td>${esc(r.nickname)} ${r.device_id === myId ? '(Tú)' : ''}</td>
                  <td>${r.attempts}</td>
                  <td>${fmtTime(r.time_seconds)}</td>
                  <td><strong>${r.score}</strong></td>
                </tr>`).join('')}
            </tbody>
          </table>` : '<p style="color:#475569;font-size:0.9rem;">Aún no hay drives registrados hoy. ¡Sé el primero!</p>'}
      `;
    }

    window.saveScore = async () => {
      /*isac-score-guard*/ const _hoy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' }); if (puzzle.date !== _hoy) { console.warn('[guard] score no registrado: dia no vigente'); const _ge = document.getElementById('submit-err'); if (_ge) _ge.textContent = 'Este dia ya no esta vigente: tu puntaje no se registro.'; return; }
      const nickInput = document.getElementById('nick-input');
      const errEl = document.getElementById('submit-err');
      const btn = document.getElementById('submit-btn');
      const nick = nickInput.value.trim();
      if (!isWon()) return;
      if (nick.length < 2) { errEl.textContent = 'Escribe un nickname de al menos 2 caracteres.'; return; }
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      errEl.textContent = '';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/game_scores`, {
          method: 'POST',
          headers: { ...SB_HEADERS, Prefer: 'return=minimal' },
          body: JSON.stringify({
            game_id: GAME_ID,
            puzzle_date: puzzle.date,
            nickname: nick,
            device_id: getDeviceId(),
            score: calcScore(),
            attempts: strikes(),
            time_seconds: Math.max(1, st.elapsed)
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          if (errData.code === '23505') throw new Error('Ya registraste tu resultado hoy desde este dispositivo.');
          throw new Error(errData.message || 'Error al guardar puntaje.');
        }
        localStorage.setItem('isac_player_nickname', nick);
        st.scoreSubmitted = true;
        saveLocal();
        await fetchLeaderboard(puzzle.date);
        renderSummary();
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Guardar en Scoreboard';
      }
    };

    init();
  </script>
</body>
</html>
