    .hidden { display: none !important; }

    const MAX_MISTAKES = 4;
    const LEVEL_EMOJI = { 1: '🟨', 2: '🟩', 3: '🟦', 4: '🟪' };
    const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
    /*isac-lock-future*/
    (function () {
      try {
        const idx = EMBEDDED_INDEX.filter(i => i.date <= todayStr);
        if (!idx.length) return;
        EMBEDDED_INDEX.splice(0, EMBEDDED_INDEX.length, ...idx);
        Object.keys(EMBEDDED_PUZZLES).forEach(k => { if (k > todayStr) delete EMBEDDED_PUZZLES[k]; });
      } catch (e) { console.warn('lock-future', e); }
    })();

    /* Recarga automática a las 00:00:02 hora CDMX para estrenar el reto diario */
    (function scheduleMidnightRefresh() {
      try {
        const fmt = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
        const p = {};
        fmt.formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
        const secNow = (parseInt(p.hour, 10) % 24) * 3600 + parseInt(p.minute, 10) * 60 + parseInt(p.second, 10);
        const msUntilMidnight = (86400 - secNow + 2) * 1000;
        setTimeout(() => { location.reload(); }, msUntilMidnight);
      } catch (e) {}
    })();

    function setBotMood(mood) {
      const img = document.getElementById('isacbot-img');
      if (!img) return;
      const file = `${mood}.webp`;
      const candidates = [`../assets/ISACLOGOS/${file}`, `assets/ISACLOGOS/${file}`];
      let idx = 0;
      img.onload = () => {
        img.hidden = false;
        img.classList.remove('bounce');
        void img.offsetWidth;
        img.classList.add('bounce');
      };
      img.onerror = () => {
        idx++;
        if (idx < candidates.length) img.src = candidates[idx];
        else img.hidden = true;
      };
      img.src = candidates[0];
    }

    let puzzle = null;
    let remainingItems = [];
    let selectedItems = [];
    let solvedLevels = [];
    let mistakes = 0;
    let guessHistory = [];
    let triedCombos = [];
    let elapsed = 0;
    let timer = null;
    let scoreSubmitted = false;
    let leaderboard = [];
    let toastTimer = null;

    function getDeviceId() {
      let id = localStorage.getItem('isac_device_id');
      if (!id) {
        id = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
              const r = Math.random() * 16 | 0;
              return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        localStorage.setItem('isac_device_id', id);
      }
      return id;
    }

    const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    const startTimer = () => { if (!timer) timer = setInterval(() => { elapsed++; document.getElementById('hud-time').textContent = fmtTime(elapsed); }, 1000); };
    const stopTimer = () => { if (timer) clearInterval(timer); timer = null; };

    function showToast(msg, type = '') {
      const bar = document.getElementById('toast-bar');
      bar.innerHTML = `<div class="toast-msg ${type}">${msg}</div>`;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { bar.innerHTML = ''; }, 2600);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    async function fetchLeaderboard(dateStr) {
      leaderboard = [];
      try {
        const url = `${SUPABASE_URL}/rest/v1/game_scores?select=nickname,score,attempts,time_seconds,device_id&game_id=eq.connections&puzzle_date=eq.${dateStr}&order=score.desc,time_seconds.asc&limit=10`;
        const res = await fetch(url, { headers: SB_HEADERS, cache: 'no-store' });
        if (res.ok) leaderboard = await res.json();
      } catch (e) {
        console.warn('No se pudo cargar el ranking remoto:', e);
      }
    }

    async function init() {
      setBotMood('saluda');
      const sel = document.getElementById('date-select');
      EMBEDDED_INDEX.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.date;
        opt.textContent = `${item.date} ${item.date === todayStr ? '(Hoy)' : ''}`;
        sel.appendChild(opt);
      });
      const hasToday = EMBEDDED_INDEX.some(item => item.date === todayStr);
      const initialDate = hasToday ? todayStr : EMBEDDED_INDEX[0].date;
      sel.value = initialDate;
      sel.onchange = () => loadDay(sel.value);
      await loadDay(initialDate);
    }

    window.goToday = async () => {
      const hasToday = EMBEDDED_INDEX.some(item => item.date === todayStr);
      const targetDate = hasToday ? todayStr : EMBEDDED_INDEX[0].date;
      document.getElementById('date-select').value = targetDate;
      await loadDay(targetDate);
    };

    window.refreshBoard = async () => {
      await fetchLeaderboard(puzzle.date);
      renderAll();
    };

    async function loadDay(dateStr) {
      stopTimer();
      document.getElementById('date-select').value = dateStr;
      puzzle = EMBEDDED_PUZZLES[dateStr];
      const saved = JSON.parse(localStorage.getItem(`isac_connections_v1_${puzzle.date}`) || 'null');

      solvedLevels = saved ? saved.solvedLevels : [];
      mistakes = saved ? saved.mistakes : 0;
      guessHistory = saved ? saved.guessHistory : [];
      triedCombos = saved ? saved.triedCombos : [];
      elapsed = saved ? saved.elapsed : 0;
      scoreSubmitted = saved ? saved.scoreSubmitted : false;
      selectedItems = [];

      const solvedSet = new Set(solvedLevels);
      const unsolved = puzzle.groups.filter(g => !solvedSet.has(g.level)).flatMap(g => g.items);
      remainingItems = shuffleArray(unsolved);

      document.getElementById('theme-pill').textContent = `Tema: ${puzzle.theme}`;
      document.getElementById('hud-time').textContent = fmtTime(elapsed);

      const banner = document.getElementById('archive-banner');
      const btnToday = document.getElementById('btn-today');
      if (puzzle.date !== todayStr) {
        banner.innerHTML = `<span>Estás jugando en <strong>Modo Archivo (${puzzle.date})</strong>. Esta partida no suma al ranking diario.</span><button class="btn-today" onclick="goToday()">Volver a Hoy</button>`;
        banner.classList.remove('hidden');
        btnToday.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
        btnToday.classList.add('hidden');
      }

      await fetchLeaderboard(puzzle.date);
      const myId = getDeviceId();
      if (leaderboard.some(r => r.device_id === myId)) scoreSubmitted = true;

      if (isWon()) setBotMood('celebracion');
      else if (isLost()) setBotMood('facepalm');
      else setBotMood('saluda');

      renderAll();
      if (!isGameOver() && (solvedLevels.length > 0 || mistakes > 0)) startTimer();
    }

    const isWon = () => solvedLevels.length === 4;
    const isLost = () => mistakes >= MAX_MISTAKES && !isWon();
    const isGameOver = () => isWon() || isLost();
    const calcScore = () => (isWon() ? Math.max(250, 1000 - mistakes * 150) : 0);

    function saveLocal() {
      localStorage.setItem(`isac_connections_v1_${puzzle.date}`, JSON.stringify({
        solvedLevels, mistakes, guessHistory, triedCombos, elapsed, scoreSubmitted
      }));
    }

    function renderAll() {
      const currentScore = isLost() ? 0 : Math.max(250, 1000 - mistakes * 150);
      document.getElementById('hud-score').textContent = currentScore;
      document.getElementById('hud-mistakes').textContent = `${mistakes} / ${MAX_MISTAKES}`;

      const stack = document.getElementById('solved-stack');
      stack.innerHTML = '';
      const displayGroups = isLost()
        ? [...puzzle.groups].sort((a, b) => {
            const idxA = solvedLevels.indexOf(a.level);
            const idxB = solvedLevels.indexOf(b.level);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.level - b.level;
          })
        : solvedLevels.map(lvl => puzzle.groups.find(g => g.level === lvl));

      displayGroups.forEach(g => {
        if (!g) return;
        const div = document.createElement('div');
        div.className = `group-banner lvl-${g.level}`;
        div.innerHTML = `
          <div class="group-title">${g.title}</div>
          <div class="group-items">${g.items.join(' · ')}</div>
          <div class="group-exp">${g.explanation}</div>
        `;
        stack.appendChild(div);
      });

      const grid = document.getElementById('board-grid');
      grid.innerHTML = '';
      if (!isGameOver()) {
        remainingItems.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'tile' + (selectedItems.includes(item) ? ' selected' : '');
          btn.textContent = item;
          btn.onclick = () => toggleTile(item);
          grid.appendChild(btn);
        });
      }

      const dots = document.getElementById('lives-dots');
      dots.innerHTML = '';
      for (let i = 0; i < MAX_MISTAKES; i++) {
        const dot = document.createElement('span');
        dot.className = 'life-dot' + (i < mistakes ? ' lost' : '');
        dots.appendChild(dot);
      }

      document.getElementById('controls-area').classList.toggle('hidden', isGameOver());
      document.getElementById('btn-clear').disabled = selectedItems.length === 0;
      document.getElementById('btn-submit').disabled = selectedItems.length !== 4;

      renderSummary();
    }

    function toggleTile(item) {
      if (isGameOver()) return;
      startTimer();
      if (selectedItems.includes(item)) {
        selectedItems = selectedItems.filter(i => i !== item);
      } else {
        if (selectedItems.length >= 4) return;
        selectedItems.push(item);
        if (selectedItems.length === 1) setBotMood('pensativo');
      }
      renderAll();
    }

    window.shuffleRemaining = () => {
      remainingItems = shuffleArray(remainingItems);
      renderAll();
    };

    window.clearSelection = () => {
      selectedItems = [];
      renderAll();
    };

    window.submitGuess = () => {
      if (selectedItems.length !== 4 || isGameOver()) return;
      startTimer();

      const comboKey = [...selectedItems].sort().join('||');
      if (triedCombos.includes(comboKey)) {
        showToast('Ya intentaste esa combinación.', 'warn');
        return;
      }

      const itemLevelMap = {};
      puzzle.groups.forEach(g => g.items.forEach(it => { itemLevelMap[it] = g.level; }));
      const guessEmojis = selectedItems.map(it => LEVEL_EMOJI[itemLevelMap[it]]).join('');

      const matchedGroup = puzzle.groups.find(g =>
        !solvedLevels.includes(g.level) &&
        selectedItems.every(it => g.items.includes(it))
      );

      if (matchedGroup) {
        guessHistory.push(guessEmojis);
        solvedLevels.push(matchedGroup.level);
        remainingItems = remainingItems.filter(it => !matchedGroup.items.includes(it));
        selectedItems = [];
        setBotMood('celebracion');
        showToast(`¡Correcto! ${matchedGroup.title}`, 'ok');
        saveLocal();
        renderAll();
        return;
      }

      triedCombos.push(comboKey);
      guessHistory.push(guessEmojis);
      mistakes++;
      setBotMood('facepalm');

      const oneAway = puzzle.groups.some(g =>
        !solvedLevels.includes(g.level) &&
        selectedItems.filter(it => g.items.includes(it)).length === 3
      );

      if (mistakes >= MAX_MISTAKES) {
        remainingItems = [];
        selectedItems = [];
        showToast('Se terminaron los intentos. Aquí están los grupos.', 'warn');
      } else if (oneAway) {
        showToast('¡Casi! Estás a una de acertar...', 'warn');
      } else {
        showToast('No forman un grupo. Intenta otra combinación.');
      }

      saveLocal();
      renderAll();

      if (!isGameOver()) {
        document.querySelectorAll('.tile.selected').forEach(el => {
          el.classList.add('shake');
          setTimeout(() => el.classList.remove('shake'), 400);
        });
      }
    };

    window.copyShare = () => {
      const text = `ISAC Connections · ${puzzle.date}\n${guessHistory.join('\n')}\nPuntaje: ${calcScore()} pts · ${fmtTime(elapsed)}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Resultado copiado al portapapeles', 'ok'));
      }
    };

    function renderSummary() {
      const sumCard = document.getElementById('summary-card');
      if (!isGameOver()) {
        sumCard.classList.add('hidden');
        return;
      }
      stopTimer();
      const won = isWon();
      const isArchive = puzzle.date !== todayStr;
      const myId = getDeviceId();
      const savedNick = localStorage.getItem('isac_player_nickname') || '';
      const finalPts = calcScore();

      sumCard.classList.remove('hidden');
      sumCard.innerHTML = `
        <h2>${won ? '¡Conexiones completadas!' : '¡Fin del juego!'}</h2>
        <p>${won
          ? `Resolviste los 4 grupos con <strong>${mistakes} ${mistakes === 1 ? 'error' : 'errores'}</strong> en <strong>${fmtTime(elapsed)}</strong> (<strong>${finalPts} pts</strong>).`
          : `Agotaste tus 4 vidas en <strong>${fmtTime(elapsed)}</strong>. ¡Mañana habrá un nuevo tablero!`}</p>
        <div class="emoji-recap">${guessHistory.join('<br/>')}</div>
        <div style="margin-bottom:1rem;">
          <button class="btn-sec" onclick="copyShare()">Copiar resultado</button>
        </div>
        ${won && !isArchive && !scoreSubmitted ? `
          <div style="margin:1rem 0;">
            <input id="nick-input" class="nick-input" value="${savedNick}" placeholder="Tu nickname..." maxlength="18" />
            <button id="submit-btn" class="btn-primary" onclick="saveScore()">Guardar en Scoreboard</button>
            <div id="submit-err" class="err-msg"></div>
          </div>` : ''}
        <div class="board-header">
          <h3 style="margin:0;">Ranking Global (${puzzle.date}) — Connections</h3>
          <button class="btn-sec" onclick="refreshBoard()">Actualizar ranking</button>
        </div>
        ${leaderboard.length ? `
          <table>
            <thead><tr><th>#</th><th>Jugador</th><th>Errores</th><th>Tiempo</th><th>Puntos</th></tr></thead>
            <tbody>
              ${leaderboard.map((r, i) => `
                <tr class="${r.device_id === myId ? 'me' : ''}">
                  <td>${i + 1}</td>
                  <td>${r.nickname} ${r.device_id === myId ? '(Tú)' : ''}</td>
                  <td>${r.attempts} / 4</td>
                  <td>${fmtTime(r.time_seconds)}</td>
                  <td><strong>${r.score}</strong></td>
                </tr>`).join('')}
            </tbody>
          </table>` : '<p style="color:#475569;font-size:0.9rem;">Aún no hay ganadores registrados hoy. ¡Sé el primero!</p>'}
      `;
    }

    window.saveScore = async () => {
      /*isac-score-guard*/ const _hoy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' }); if (puzzle.date !== _hoy) { console.warn('[guard] score no registrado: dia no vigente'); const _ge = document.getElementById('submit-err'); if (_ge) _ge.textContent = 'Este dia ya no esta vigente: tu puntaje no se registro.'; return; }
      const nickInput = document.getElementById('nick-input');
      const errEl = document.getElementById('submit-err');
      const btn = document.getElementById('submit-btn');
      const nick = nickInput.value.trim();
      if (nick.length < 2) {
        errEl.textContent = 'Escribe un nickname de al menos 2 caracteres.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';
      errEl.textContent = '';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/game_scores`, {
          method: 'POST',
          headers: { ...SB_HEADERS, Prefer: 'return=minimal' },
          body: JSON.stringify({
            game_id: 'connections',
            puzzle_date: puzzle.date,
            nickname: nick,
            device_id: getDeviceId(),
            score: calcScore(),
            attempts: mistakes,
            time_seconds: Math.max(1, elapsed)
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          if (errData.code === '23505') throw new Error('Ya registraste tu resultado hoy desde este dispositivo.');
          throw new Error(errData.message || 'Error al guardar puntaje.');
        }

        localStorage.setItem('isac_player_nickname', nick);
        scoreSubmitted = true;
        saveLocal();
        await fetchLeaderboard(puzzle.date);
        renderAll();
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Guardar en Scoreboard';
      }
    };

    init();
  </script>
</body>
</html>
