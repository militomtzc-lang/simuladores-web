  <style>
    :root {
      --green-dark: #00593f;
      --green-main: #007554;
      --green-light: #ecfdf5;
      --green-border: #a7f3d0;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-subtle: #e2e8f0;
    }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Sora', sans-serif;
    }

    .jeopardy-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .game-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-subtle);
      padding-bottom: 1.25rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--green-dark);
      background: var(--green-light);
      border: 1px solid var(--green-border);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 700;
    }

    h1 {
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 3.1rem;
      font-weight: 800;
      line-height: 1;
      margin: 0.35rem 0 0.2rem;
      color: var(--green-dark);
    }

    .theme-subtitle {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .hud {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .hud-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.5rem 0.95rem;
      display: flex;
      flex-direction: column;
      min-width: 95px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .hud-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .hud-value {
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--green-dark);
      line-height: 1.1;
    }

    select {
      background: transparent;
      color: var(--text-main);
      border: none;
      font-family: 'Sora', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.2rem;
      cursor: pointer;
    }

    .archive-banner {
      background: #fefce8;
      border: 1px solid #fde047;
      color: #854d0e;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.85rem;
    }

    .category-col {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .category-header {
      background: var(--green-dark);
      color: #ffffff;
      border-radius: 10px;
      padding: 1rem 0.6rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 4px rgba(0, 89, 63, 0.15);
    }

    .clue-cell {
      background: var(--bg-card);
      border: 2px solid var(--green-main);
      border-radius: 10px;
      padding: 1.35rem 0.5rem;
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--green-dark);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .clue-cell:hover:not(:disabled) {
      background: var(--green-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 89, 63, 0.12);
    }

    .clue-cell:disabled {
      cursor: default;
      border-color: var(--border-subtle);
      background: #f1f5f9;
      color: #94a3b8;
      box-shadow: none;
    }

    .clue-cell.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
    }

    .clue-cell.wrong {
      background: #fee2e2;
      border-color: #f87171;
      color: #b91c1c;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 5px solid var(--green-dark);
      border-radius: 14px;
      max-width: 600px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.2);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-points {
      font-weight: 700;
      color: var(--green-dark);
      font-size: 1rem;
    }

    .dd-badge {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #b45309;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
    }

    .clue-text {
      font-size: 1.15rem;
      line-height: 1.55;
      margin-bottom: 1.5rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .options-grid {
      display: grid;
      gap: 0.65rem;
    }

    .option-btn {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      color: var(--text-main);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      text-align: left;
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--green-main);
      background: var(--green-light);
    }

    .option-btn.opt-correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.opt-wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
    }

    .explanation-box {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .btn-primary {
      margin-top: 0.75rem;
      background: var(--green-dark);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.3rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      transition: background 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--green-main);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .summary-card {
      margin-top: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 4px solid var(--green-dark);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
    }

    .summary-card h2 {
      margin-top: 0;
      color: var(--green-dark);
    }

    input {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: var(--text-main);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-family: 'Sora', sans-serif;
      margin-right: 0.5rem;
    }

    input:focus {
      outline: none;
      border-color: var(--green-main);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }

    th {
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    th, td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }

    tr.me {
      background: var(--green-light);
      color: var(--green-dark);
      font-weight: 600;
    }

    .err-msg {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .hidden {
      display: none !important;
    }
  </style>

      await loadBoard(EMBEDDED_INDEX[0].date);
    }

    async function loadBoard(dateStr) {
      stopTimer();
      board = EMBEDDED_BOARDS[dateStr];
      const saved = JSON.parse(localStorage.getItem(`isac_prev_${board.date}`) || 'null');
      answered = saved ? saved.answered : {};
      elapsed = saved ? saved.elapsed : 0;
      scoreSubmitted = saved ? saved.scoreSubmitted : false;

      document.getElementById('theme-subtitle').textContent = board.day_theme;
      document.getElementById('hud-time').textContent = fmtTime(elapsed);
      const banner = document.getElementById('archive-banner');
      if (board.date !== todayStr) {
        banner.innerHTML = `Estás jugando en <strong>Modo Archivo (${board.date})</strong>. Esta partida no suma al ranking diario.`;
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }

      await fetchLeaderboard(board.date);
      renderBoard();
      if (Object.keys(answered).length < 12) startTimer();
    }

    function renderBoard() {
      const score = Object.values(answered).reduce((a, b) => a + b.earned, 0);
      document.getElementById('hud-score').textContent = score;
      const grid = document.getElementById('board-grid');
      grid.innerHTML = '';

      board.categories.forEach(cat => {
        const col = document.createElement('div');
        col.className = 'category-col';
        col.innerHTML = `<div class="category-header">${cat.name}</div>`;
        cat.questions.forEach(q => {
          const btn = document.createElement('button');
          btn.className = 'clue-cell';
          const res = answered[q.id];
          if (res) {
            btn.disabled = true;
            btn.classList.add(res.correct ? 'correct' : 'wrong');
            btn.textContent = res.correct ? `+${res.earned}` : '0';
          } else {
            btn.textContent = `$${q.points}`;
            btn.onclick = () => openModal(q);
          }
          col.appendChild(btn);
        });
        grid.appendChild(col);
      });

      const sumCard = document.getElementById('summary-card');
      if (Object.keys(answered).length === 12) {
        stopTimer();
        const isArchive = board.date !== todayStr;
        const myId = getDeviceId();
        const savedNick = localStorage.getItem('isac_player_nickname') || '';

        sumCard.classList.remove('hidden');
        sumCard.innerHTML = `
          <h2>¡Tablero completado!</h2>
          <p>Obtuviste <strong>${score} de ${board.max_points} pts</strong> en <strong>${fmtTime(elapsed)}</strong>.</p>
          ${!isArchive && !scoreSubmitted ? `
            <div style="margin:1rem 0;">
              <input id="nick-input" value="${savedNick}" placeholder="Tu nickname..." maxlength="18" />
              <button id="submit-btn" class="btn-primary" onclick="saveScore(${score})">Guardar en Scoreboard</button>
              <div id="submit-err" class="err-msg"></div>
            </div>` : ''}
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;margin-top:1rem;"><h3 style="margin:0;">Ranking Global (${board.date})</h3><button id="btn-refresh-jeop" type="button" onclick="refreshJeopBoard()" style="background:#f1f5f9;color:#0f172a;border:1px solid #cbd5e1;padding:0.4rem 0.85rem;border-radius:8px;font-family:'Sora',sans-serif;font-size:0.78rem;font-weight:600;cursor:pointer;">Actualizar ranking</button></div>
          ${leaderboard.length ? `
            <table>
              <thead><tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Tiempo</th></tr></thead>
              <tbody>
                ${leaderboard.map((r,i)=>`
                  <tr class="${r.device_id === myId ? 'me' : ''}">
                    <td>${i+1}</td>
                    <td>${r.nickname} ${r.device_id === myId ? '(Tú)' : ''}</td>
                    <td><strong>${r.score}</strong></td>
                    <td>${fmtTime(r.time_seconds)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>` : '<p style="color:#475569;font-size:0.9rem;">Aún no hay puntajes registrados hoy. ¡Sé el primero!</p>'}
        `;
      } else {
        sumCard.classList.add('hidden');
      }
    }

    function openModal(q) {
      activeQ = q;
      document.getElementById('modal-points').textContent = `$${q.daily_double ? q.points*2 : q.points} PTS`;
      document.getElementById('dd-badge').classList.toggle('hidden', !q.daily_double);
      document.getElementById('clue-text').textContent = `"${q.clue}"`;
      document.getElementById('explanation-box').classList.add('hidden');
      const optGrid = document.getElementById('options-grid');
      optGrid.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'option-btn';
        b.textContent = opt;
        b.onclick = () => pickOption(idx, b);
        optGrid.appendChild(b);
      });
      document.getElementById('modal-backdrop').classList.remove('hidden');
      startTimer();
    }

    function pickOption(idx, btnEl) {
      stopTimer();
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((b, i) => {
        b.disabled = true;
        if (i === activeQ.answer_index) b.classList.add('opt-correct');
      });
      const correct = idx === activeQ.answer_index;
      if (!correct) btnEl.classList.add('opt-wrong');

      const earned = correct ? activeQ.points * (activeQ.daily_double ? 2 : 1) : 0;
      answered[activeQ.id] = { correct, earned };
      localStorage.setItem(`isac_prev_${board.date}`, JSON.stringify({ answered, elapsed, scoreSubmitted }));

      document.getElementById('explanation-text').textContent = activeQ.explanation;
      document.getElementById('explanation-box').classList.remove('hidden');
      renderBoard();
    }

    document.getElementById('continue-btn').onclick = () => {
      document.getElementById('modal-backdrop').classList.add('hidden');
      if (Object.keys(answered).length < 12) startTimer();
    };

    window.saveScore = async (score) => {
      const nickInput = document.getElementById('nick-input');
      const errEl = document.getElementById('submit-err');
      const btn = document.getElementById('submit-btn');
      const nick = nickInput.value.trim();
      if (nick.length < 2) {
        errEl.textContent = 'Escribe un nickname de al menos 2 caracteres.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';
      errEl.textContent = '';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/game_scores`, {
          method: 'POST',
          headers: { ...SB_HEADERS, Prefer: 'return=minimal' },
          body: JSON.stringify({
            game_id: 'jeopardy',
            puzzle_date: board.date,
            nickname: nick,
            device_id: getDeviceId(),
            score: score,
            time_seconds: Math.max(1, elapsed)
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          if (errData.code === '23505') throw new Error('Ya registraste un puntaje hoy desde este dispositivo.');
          if (errData.code === '42501') throw new Error(errData.message || 'Fecha fuera de rango permitido.');
          throw new Error(errData.message || 'Error al guardar puntaje.');
        }

        localStorage.setItem('isac_player_nickname', nick);
        scoreSubmitted = true;
        localStorage.setItem(`isac_prev_${board.date}`, JSON.stringify({ answered, elapsed, scoreSubmitted }));
        await fetchLeaderboard(board.date);
        renderBoard();
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Guardar en Scoreboard';
      }
    };

    init();
  
    window.refreshJeopBoard = async () => {
      const btn = document.getElementById('btn-refresh-jeop');
      if (btn) { btn.disabled = true; btn.textContent = 'Actualizando...'; }
      try {
        const activeDate = (typeof puzzle !== 'undefined' && puzzle && puzzle.date)
          ? puzzle.date
          : (document.getElementById('date-select') ? document.getElementById('date-select').value : todayStr);
        if (typeof fetchLeaderboard === 'function') {
          await fetchLeaderboard(activeDate);
        }
        if (typeof getDeviceId === 'function' && Array.isArray(leaderboard)) {
          const myId = getDeviceId();
          if (leaderboard.some(r => r.device_id === myId) && typeof scoreSubmitted !== 'undefined') {
            scoreSubmitted = true;
          }
        }
        if (typeof renderSummary === 'function') renderSummary();
        else if (typeof renderAll === 'function') renderAll();
        else if (typeof renderBoard === 'function') renderBoard();
      } finally {
        const btnAfter = document.getElementById('btn-refresh-jeop');
        if (btnAfter) { btnAfter.disabled = false; btnAfter.textContent = 'Actualizar ranking'; }
      }
    };

  </script>
</body>
</html>
