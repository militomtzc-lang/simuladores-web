      --green-main: #007554;
      --green-light: #ecfdf5;
      --green-border: #a7f3d0;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-subtle: #e2e8f0;
    }

    body {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Sora', sans-serif;
    }

    .jeopardy-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .game-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-subtle);
      padding-bottom: 1.25rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--green-dark);
      background: var(--green-light);
      border: 1px solid var(--green-border);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 700;
    }

    h1 {
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 3.1rem;
      font-weight: 800;
      line-height: 1;
      margin: 0.35rem 0 0.2rem;
      color: var(--green-dark);
    }

    .theme-subtitle {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .hud {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .hud-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.5rem 0.95rem;
      display: flex;
      flex-direction: column;
      min-width: 95px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .hud-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .hud-value {
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--green-dark);
      line-height: 1.1;
    }

    select {
      background: transparent;
      color: var(--text-main);
      border: none;
      font-family: 'Sora', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.2rem;
      cursor: pointer;
    }

    .archive-banner {
      background: #fefce8;
      border: 1px solid #fde047;
      color: #854d0e;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.85rem;
    }

    .category-col {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .category-header {
      background: var(--green-dark);
      color: #ffffff;
      border-radius: 10px;
      padding: 1rem 0.6rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 4px rgba(0, 89, 63, 0.15);
    }

    .clue-cell {
      background: var(--bg-card);
      border: 2px solid var(--green-main);
      border-radius: 10px;
      padding: 1.35rem 0.5rem;
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--green-dark);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .clue-cell:hover:not(:disabled) {
      background: var(--green-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 89, 63, 0.12);
    }

    .clue-cell:disabled {
      cursor: default;
      border-color: var(--border-subtle);
      background: #f1f5f9;
      color: #94a3b8;
      box-shadow: none;
    }

    .clue-cell.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
    }

    .clue-cell.wrong {
      background: #fee2e2;
      border-color: #f87171;
      color: #b91c1c;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 5px solid var(--green-dark);
      border-radius: 14px;
      max-width: 600px;
      width: 100%;
      padding: 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.2);
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-points {
      font-weight: 700;
      color: var(--green-dark);
      font-size: 1rem;
    }

    .dd-badge {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #b45309;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
    }

    .clue-text {
      font-size: 1.15rem;
      line-height: 1.55;
      margin-bottom: 1.5rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .options-grid {
      display: grid;
      gap: 0.65rem;
    }

    .option-btn {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      color: var(--text-main);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      text-align: left;
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--green-main);
      background: var(--green-light);
    }

    .option-btn.opt-correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.opt-wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
    }

    .explanation-box {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .btn-primary {
      margin-top: 0.75rem;
      background: var(--green-dark);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.3rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      transition: background 0.15s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--green-main);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .summary-card {
      margin-top: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 4px solid var(--green-dark);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
    }

    .summary-card h2 {
      margin-top: 0;
      color: var(--green-dark);
    }

    input {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: var(--text-main);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-family: 'Sora', sans-serif;
      margin-right: 0.5rem;
    }

    input:focus {
      outline: none;
      border-color: var(--green-main);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }

    th {
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    th, td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }

    tr.me {
      background: var(--green-light);
      color: var(--green-dark);
      font-weight: 600;
    }

    .err-msg {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .hidden {
      display: none !important;
    }

  function stickerFor(text, d) {
    var t = norm(text);
    if (/futbol americano|\bnfl\b|emparrillado|\bepa\b/.test(t)) return [pick(['americano1', 'americano2'], d), 'isacbot'];
    if (/hockey|\bnhl\b/.test(t)) return ['hockey', 'isacbot'];

      img.style.display = '';

  var bot = null, kind = null, lastDate = null, baseNames = null, moodTimer = null;
  var last = { found: null, hints: null, guesses: null, answered: null };

  function ensureBot() {
    if (bot) return bot;
    var box = document.querySelector('.game-header > div');
    if (!box) return null;
    var row = document.createElement('div');
    row.className = 'isac-title-row';
    var text = document.createElement('div');
    while (box.firstChild) text.appendChild(box.firstChild);
    bot = document.createElement('img');
    bot.className = 'isac-bot'; bot.alt = ''; bot.setAttribute('aria-hidden', 'true'); bot.decoding = 'async';
    row.appendChild(bot); row.appendChild(text);
    box.appendChild(row);
    return bot;
  }

  function mood(names, ms) {
    if (!bot) return;
    if (moodTimer) { clearTimeout(moodTimer); moodTimer = null; }
    bot.removeAttribute('data-k');
    load(bot, names, true);
    if (ms) moodTimer = setTimeout(function () { moodTimer = null; bot.removeAttribute('data-k'); load(bot, baseNames, true); }, ms);
  }

  // Lee una variable global del juego (declarada con let/const en el script principal) sin romper si no existe
  function g(name) { try { return (new Function('return typeof ' + name + " !== 'undefined' ? " + name + ' : undefined'))(); } catch (e) { return undefined; } }

  function refresh() {
    try {
      if (typeof EMBEDDED_INDEX === 'undefined') return;
      var sel = document.getElementById('date-select');
      var d = sel && sel.value;
      if (!d || !ensureBot()) return;
      var it = null;
      for (var i = 0; i < EMBEDDED_INDEX.length; i++) { if (EMBEDDED_INDEX[i].date === d) { it = EMBEDDED_INDEX[i]; break; } }
      if (!it) return;

      kind = document.getElementById('hud-attempts') ? 'fg' : (document.getElementById('theme-subtitle') ? 'jeop' : 'strands');
      var card = document.getElementById('summary-card');
      var over = !!(card && !card.classList.contains('hidden') && card.textContent.replace(/\s+/g, '').length > 0);
      var won = over && (kind !== 'fg' || /descubierta/.test(norm(card.textContent)));

      var themed = kind === 'fg' ? ['saluda', 'isacbot'] : stickerFor(kind === 'jeop' ? it.theme : it.sport, d);
      var base = over ? [won ? 'celebracion' : 'facepalm', 'isacbot'] : themed;

      // Cambio de fecha: se reinician contadores sin disparar estados de animo
      var newDate = (lastDate !== d);
      lastDate = d;
      var cur = {
        found: kind === 'strands' && g('foundWords') ? g('foundWords').length : null,
        hints: kind === 'strands' ? g('hintsUsed') : null,
        guesses: kind === 'fg' && g('guesses') ? g('guesses').length : null,
        answered: kind === 'jeop' && g('answered') ? Object.keys(g('answered')).length : null
      };
      var event = null;
      if (!newDate) {
        if (cur.found !== null && last.found !== null && cur.found > last.found) event = ['celebracion', 'isacbot'];
        else if (cur.hints !== null && last.hints !== null && cur.hints > last.hints) event = ['pensativo', 'isacbot'];
        else if (cur.guesses !== null && last.guesses !== null && cur.guesses > last.guesses && !over) event = ['pensativo', 'isacbot'];
        else if (cur.answered !== null && last.answered !== null && cur.answered > last.answered) {
          var ans = g('answered'), keys = Object.keys(ans), lastKey = keys[keys.length - 1];
          event = (ans[lastKey] && ans[lastKey].correct === false) ? ['facepalm', 'isacbot'] : ['celebracion', 'isacbot'];
        }
      }
      last = cur;

      var baseKey = base.join('|') + '@' + d;
      if (newDate || baseKey !== (baseNames && baseNames._k)) {
        baseNames = base; baseNames._k = baseKey;
        if (over && moodTimer) { clearTimeout(moodTimer); moodTimer = null; }   // el final de la partida manda
        if (!moodTimer) { bot.removeAttribute('data-k'); load(bot, base, true); }
      }
      if (event && !over) mood(event, 2400);

      // Franchise Guesser: sticker del deporte en la tarjeta de resumen (solo al terminar)
      if (kind === 'fg' && over && !card.querySelector('.isac-st-res')) {
        var r = document.createElement('img');
        r.className = 'isac-st-res'; r.alt = ''; r.setAttribute('aria-hidden', 'true'); r.decoding = 'async';
        card.insertBefore(r, card.firstChild);
        load(r, stickerFor(it.sport + ' ' + (it.league || ''), d), false);
      }
    } catch (e) { console.warn('[stickers]', e); }
  }

  var pending = false;
  function schedule() {
    if (pending) return;
    pending = true;
    (window.requestAnimationFrame || setTimeout)(function () { pending = false; refresh(); });
  }
  schedule();
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['class'] });
})();
</script>

    nav.className = 'isac-top-nav';
