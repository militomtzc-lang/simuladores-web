<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISAC GAMES</title>
<meta name="description" content="Juegos diarios de analítica deportiva del laboratorio ISAC.">
<meta name="theme-color" content="#00593f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Para usar la tipografía propia del lab: cambiar --font-main y agregar un @font-face */
  :root {
    --font-main: 'Sora', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --green: #00593f;
    --green-hover: #007554;
    --green-soft: #e6f2ee;
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border-subtle: #e2e8f0;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-main);
    font-family: var(--font-main);
    line-height: 1.45;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .topbar {
    background: #ffffff;
    border-bottom: 3px solid var(--green);
    padding: 12px 16px;
  }
  .topbar-inner {
    max-width: 1040px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
  }
  .brand-logo { height: 32px; width: auto; display: none; }
  .brand-text { font-weight: 800; letter-spacing: .04em; color: var(--green); font-size: 1rem; }
  .brand-sub { color: var(--text-muted); font-size: .75rem; margin-left: auto; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
  .hero { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .hero-text { flex: 1; min-width: 0; }
  h1 { margin: 0 0 6px; font-size: 1.75rem; font-weight: 800; color: var(--green); line-height: 1.15; }
  .lead { margin: 0; color: var(--text-muted); font-size: .95rem; }
  .mascot { display: none; height: 96px; width: auto; flex-shrink: 0; }
  .countdown {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 8px 12px;
    background: var(--green-soft); color: var(--green);
    border-radius: 999px; font-size: .8rem; font-weight: 600;
  }
  .countdown b { font-variant-numeric: tabular-nums; font-weight: 800; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    transition: box-shadow .15s, transform .15s, border-color .15s;
  }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .icon {
    width: 48px; height: 48px; flex-shrink: 0;
    display: grid; place-items: center;
    background: var(--green-soft); border-radius: 12px; font-size: 1.5rem;
  }
  .card h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }
  .tag { display: inline-block; margin-top: 2px; font-size: .72rem; font-weight: 600; color: var(--text-muted); }
  .card p { margin: 0; color: var(--text-muted); font-size: .9rem; }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--green); color: #ffffff;
    font-family: inherit; font-weight: 700; font-size: 1rem;
    padding: 14px 16px; border-radius: 12px; min-height: 48px;
    transition: background .15s;
  }
  .card.activo:hover { border-color: var(--green); box-shadow: 0 6px 18px rgba(0,89,63,.12); transform: translateY(-2px); }
  .btn:hover { background: var(--green-hover); }
  .btn:focus-visible { outline: 3px solid #86c5ae; outline-offset: 2px; }
  .card.pronto { background: transparent; border-style: dashed; border-color: #cbd5e1; box-shadow: none; }
  .card.pronto .icon { background: #f1f5f9; filter: grayscale(1); opacity: .8; }
  .card.pronto h2 { color: var(--text-muted); }
  .soon { text-align: center; font-weight: 600; font-size: .85rem; color: #64748b; padding: 12px; background: #f1f5f9; border-radius: 12px; }
  footer { text-align: center; color: var(--text-muted); font-size: .78rem; padding: 8px 16px 28px; }
  @media (min-width: 700px) {
    h1 { font-size: 2.25rem; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .mascot { display: block; }
    main { padding-top: 40px; }
  }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <!-- Cuando subas assets/logo.svg (o .png) aparece solo; mientras tanto se ve el texto -->
    <img class="brand-logo" id="brandLogo" alt="Laboratorio ISAC" src="assets/logo.svg">
    <span class="brand-text" id="brandText">ISAC GAMES</span>
    <span class="brand-sub">Sports Analytics Lab</span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-text">
      <h1>ISAC GAMES</h1>
      <p class="lead">Un reto nuevo cada día. Juega, compite en el ranking del día y vuelve mañana.</p>
      <div class="countdown" aria-live="off">⏱ Próximo reto en <b id="countdown">--:--:--</b></div>
    </div>
    <!-- Mascota opcional: assets/isacbot-hola.webp (se oculta sola si no existe) -->
    <img class="mascot" id="mascot" alt="" src="assets/isacbot-hola.webp">
  </section>

  <section class="grid" id="games" aria-label="Juegos disponibles"></section>
</main>

<footer>Ranking diario en cada juego · Hecho por el laboratorio ISAC</footer>

<script>
/* Para agregar un juego: agrega un objeto a este arreglo.
   estado: "activo" (con enlace) o "pronto" (tarjeta gris, sin enlace). */
const GAMES = [
  { id: "franchise-guesser", nombre: "Franchise Guesser", emoji: "🏆",
    desc: "Adivina la franquicia del día con pistas en cada intento.",
    url: "franchise-guesser/", tag: "Diario", estado: "activo" },
  { id: "isactrivia", nombre: "ISACtrivia", emoji: "🎯",
    desc: "Trivia deportiva estilo Jeopardy: elige categoría y suma puntos.",
    url: "isactrivia/", tag: "Diario", estado: "activo" },
  { id: "strands", nombre: "StatStrands", emoji: "🔤",
    desc: "Encuentra las palabras ocultas del día en la cuadrícula.",
    url: "strands/", tag: "Diario", estado: "activo" },
  { id: "connections", nombre: "Connections", emoji: "🧩",
    desc: "Agrupa los elementos que comparten una conexión.",
    url: "connections/", tag: "Próximamente", estado: "pronto" }
];

const grid = document.getElementById('games');
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
GAMES.forEach(g => {
  const card = el('article', 'card ' + g.estado);
  const head = el('div', 'card-head');
  head.appendChild(el('div', 'icon', g.emoji));
  const titles = el('div');
  titles.appendChild(el('h2', '', g.nombre));
  titles.appendChild(el('span', 'tag', g.tag));
  head.appendChild(titles);
  card.appendChild(head);
  card.appendChild(el('p', '', g.desc));
  if (g.estado === 'activo') {
    const a = el('a', 'btn', 'Jugar →');
    a.href = g.url;
    a.setAttribute('aria-label', 'Jugar ' + g.nombre);
    card.appendChild(a);
  } else {
    card.appendChild(el('div', 'soon', 'Próximamente'));
  }
  grid.appendChild(card);
});

/* Logo y mascota: si el archivo no existe, se mantiene el texto / se oculta */
(function () {
  const logo = document.getElementById('brandLogo');
  logo.onload = () => { logo.style.display = 'block'; document.getElementById('brandText').style.display = 'none'; };
  logo.onerror = () => { logo.remove(); };
  const m = document.getElementById('mascot');
  m.onerror = () => { m.remove(); };
})();

/* Cuenta regresiva a la medianoche de CDMX (misma lógica que el bloqueo de días futuros) */
(function () {
  const out = document.getElementById('countdown');
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const p = {};
    fmt.formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    const sec = (parseInt(p.hour, 10) % 24) * 3600 + parseInt(p.minute, 10) * 60 + parseInt(p.second, 10);
    const left = 86400 - sec;
    out.textContent = pad(Math.floor(left / 3600)) + ':' + pad(Math.floor(left % 3600 / 60)) + ':' + pad(left % 60);
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
